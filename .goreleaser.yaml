version: 2

project_name: hacocoon

builds:
  - id: haco
    main: ./cmd/haco-product
    binary: haco
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - >-
        -s -w
        -X github.com/SLktEx/Hacocoon/internal/buildinfo.SoftwareVersion={{ .Version }}
        -X github.com/SLktEx/Hacocoon/internal/buildinfo.Commit={{ .Commit }}
        -X github.com/SLktEx/Hacocoon/internal/buildinfo.BuildDate={{ .Date }}
  - id: hacoq
    main: ./cmd/haco
    binary: hacoq
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - >-
        -s -w
        -X github.com/SLktEx/Hacocoon/internal/buildinfo.SoftwareVersion={{ .Version }}
        -X github.com/SLktEx/Hacocoon/internal/buildinfo.Commit={{ .Commit }}
        -X github.com/SLktEx/Hacocoon/internal/buildinfo.BuildDate={{ .Date }}
  - id: haco-controller
    main: ./cmd/haco-controller
    binary: haco-controller
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: [-s -w]
  - id: haco-host
    main: ./cmd/haco-host
    binary: haco-host
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: [-s -w]
  - id: haco-vscode
    main: ./cmd/haco-vscode
    binary: haco-vscode
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: [-s -w]
  - id: haco-agent-host
    main: ./cmd/haco-agent-host
    binary: haco-agent-host
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: [-s -w]
  - id: haco-notify
    main: ./cmd/haco-notify
    binary: haco-notify
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: [-s -w]
  - id: haco-storage-helper
    main: ./cmd/haco-storage-helper
    binary: haco-storage-helper
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: [-s -w]

archives:
  - id: haco
    ids:
      - haco
      - hacoq
      - haco-controller
      - haco-host
      - haco-vscode
      - haco-agent-host
      - haco-notify
      - haco-storage-helper
    formats: [tar.gz]
    name_template: "haco_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  disable: true
