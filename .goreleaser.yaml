version: 2

project_name: hacocoon

builds:
  - id: haco
    main: ./cmd/haco
    binary: haco
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
  - id: haco-vscode
    main: ./cmd/haco-vscode
    binary: haco-vscode
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
  - id: haco-agent-host
    main: ./cmd/haco-agent-host
    binary: haco-agent-host
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w

archives:
  - id: haco
    ids:
      - haco
      - haco-vscode
      - haco-agent-host
    formats:
      - tar.gz
    name_template: "haco_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt
  algorithm: sha256
  extra_files:
    - glob: ./scripts/install.sh
      name_template: install.sh
    - glob: ./scripts/bootstrap-wsl.sh
      name_template: bootstrap-wsl.sh
    - glob: ./scripts/install-windows.ps1
      name_template: install-windows.ps1

changelog:
  disable: true
