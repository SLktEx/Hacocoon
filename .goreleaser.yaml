version: 2

project_name: hacocoon

builds:
  - id: haco
    main: ./cmd/haco
    binary: haco
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - >-
        -s -w
        -X github.com/SLktEx/Hacocoon/internal/buildinfo.SoftwareVersion={{ .Version }}
        -X github.com/SLktEx/Hacocoon/internal/buildinfo.Commit={{ .Commit }}
        -X github.com/SLktEx/Hacocoon/internal/buildinfo.BuildDate={{ .Date }}
  - id: haco-controller
    main: ./cmd/haco-controller
    binary: haco-controller
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
  - id: haco-host
    main: ./cmd/haco-host
    binary: haco-host
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
  - id: haco-vscode
    main: ./cmd/haco-vscode
    binary: haco-vscode
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
  - id: haco-agent-host
    main: ./cmd/haco-agent-host
    binary: haco-agent-host
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
  - id: haco-notify
    main: ./cmd/haco-notify
    binary: haco-notify
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
  - id: haco-storage-helper
    main: ./cmd/haco-storage-helper
    binary: haco-storage-helper
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w

archives:
  - id: haco
    ids:
      - haco
      - haco-controller
      - haco-host
      - haco-vscode
      - haco-agent-host
      - haco-notify
      - haco-storage-helper
    formats:
      - tar.gz
    name_template: "haco_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt
  algorithm: sha256
  extra_files:
    - glob: ./scripts/install.sh
      name_template: install.sh
    - glob: ./scripts/install-ubuntu.sh
      name_template: install-ubuntu.sh
    - glob: ./scripts/install-windows.ps1
      name_template: install-windows.ps1

changelog:
  disable: true
