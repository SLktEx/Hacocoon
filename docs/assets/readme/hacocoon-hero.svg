<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="690" viewBox="0 0 1440 690" role="img" aria-labelledby="title desc">
<title id="title">AI runs inside. Authority stays outside.</title>
<desc id="desc">Hacocoon isolates developer and coding agent work while mediating privileged access to GitHub, cloud services, and the host.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f8fafc"/><stop offset=".55" stop-color="#eef6ff"/><stop offset="1" stop-color="#f5f3ff"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" x2="1"><stop offset="0" stop-color="#0ea5e9"/><stop offset=".48" stop-color="#14b8a6"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#0f172a" flood-opacity=".12"/></filter>
</defs>
<rect x="1" y="1" width="1438" height="688" rx="36" fill="url(#bg)" stroke="#dbeafe" stroke-width="2"/>
<circle cx="1280" cy="95" r="190" fill="#dbeafe" opacity=".55"/><circle cx="1320" cy="55" r="125" fill="#ede9fe" opacity=".7"/>
<g transform="translate(58,64)">
  <text x="0" y="56" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="58" font-weight="800" fill="#0f172a">AI runs inside.</text>
  <text x="0" y="123" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="58" font-weight="800" fill="#0f172a">Authority stays <tspan fill="#6d28d9">outside.</tspan></text>
  <text x="0" y="172" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" fill="#475569">Keep the agent productive inside the workspace.</text>
  <text x="0" y="206" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" fill="#475569">Keep host credentials and privileged actions behind policy.</text>
  <g transform="translate(0,260)" filter="url(#shadow)">
    <rect width="540" height="300" rx="24" fill="#0f172a"/><rect x="0" y="0" width="540" height="48" rx="24" fill="#111827"/>
    <circle cx="28" cy="24" r="7" fill="#f87171"/><circle cx="52" cy="24" r="7" fill="#fbbf24"/><circle cx="76" cy="24" r="7" fill="#4ade80"/>
    <text x="104" y="31" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" fill="#cbd5e1">workspace — terminal</text>
    <text x="28" y="94" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22" fill="#5eead4">$ haco run --workspace . -- go test ./...</text>
    <text x="28" y="138" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="20" fill="#94a3b8">ok   github.com/example/project/pkg</text>
    <text x="28" y="176" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="20" fill="#94a3b8">ok   github.com/example/project/cmd</text>
    <text x="28" y="222" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="21" fill="#86efac">PASS</text><text x="28" y="260" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="20" fill="#cbd5e1">$ _</text>
  </g>
</g>
<g transform="translate(690,82)">
  <text x="320" y="0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#64748b">TRUST BOUNDARY</text>
  <rect x="80" y="35" width="480" height="236" rx="30" fill="#ffffff" stroke="#60a5fa" stroke-width="3" filter="url(#shadow)"/>
  <text x="320" y="89" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="800" fill="#0f172a">Hacocoon Environment</text>
  <text x="320" y="127" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" fill="#475569">isolated workspace runtime</text>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#334155">
    <rect x="126" y="158" width="170" height="48" rx="24" fill="#ecfeff"/><text x="211" y="188" text-anchor="middle">build · test · debug</text>
    <rect x="316" y="158" width="190" height="48" rx="24" fill="#f0fdf4"/><text x="411" y="188" text-anchor="middle">resource budgets</text>
    <rect x="173" y="218" width="294" height="34" rx="17" fill="#eef2ff"/><text x="320" y="241" text-anchor="middle">broad local freedom</text>
  </g>
  <line x1="320" y1="271" x2="320" y2="326" stroke="url(#accent)" stroke-width="5"/><polygon points="320,341 309,322 331,322" fill="#7c3aed"/>
  <rect x="80" y="350" width="480" height="82" rx="24" fill="#ffffff" stroke="#8b5cf6" stroke-width="3" stroke-dasharray="9 8"/>
  <text x="320" y="385" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="800" fill="#5b21b6">Policy · Capability · Approval · Audit</text>
  <text x="320" y="416" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#64748b">privileged actions stay host-mediated</text>
  <g transform="translate(0,474)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="0" y="0" width="185" height="102" rx="20" fill="#fff" stroke="#cbd5e1"/><rect x="227" y="0" width="185" height="102" rx="20" fill="#fff" stroke="#cbd5e1"/><rect x="454" y="0" width="185" height="102" rx="20" fill="#fff" stroke="#cbd5e1"/>
    <text x="92" y="45" text-anchor="middle" font-size="25" font-weight="800" fill="#0f172a">GitHub</text><text x="92" y="73" text-anchor="middle" font-size="16" fill="#64748b">push · PR · issues</text>
    <text x="319" y="45" text-anchor="middle" font-size="25" font-weight="800" fill="#0f172a">Cloud</text><text x="319" y="73" text-anchor="middle" font-size="16" fill="#64748b">AWS · APIs</text>
    <text x="546" y="45" text-anchor="middle" font-size="25" font-weight="800" fill="#0f172a">Host</text><text x="546" y="73" text-anchor="middle" font-size="16" fill="#64748b">files · network · devices</text>
  </g>
</g>
</svg>