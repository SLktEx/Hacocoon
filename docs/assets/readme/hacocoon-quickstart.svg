<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="500" viewBox="0 0 1440 500" role="img" aria-labelledby="title desc">
<title id="title">Hacocoon VS Code Quick Start</title>
<desc id="desc">Four steps: open workspace, create or reuse environment, prepare loopback SSH, open workspace in VS Code.</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#10152b"/></linearGradient>
  <linearGradient id="a" x1="0" x2="1"><stop offset="0" stop-color="#0ea5e9"/><stop offset=".55" stop-color="#14b8a6"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
</defs>
<rect width="1440" height="500" rx="34" fill="url(#bg)"/>
<text x="720" y="60" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="800" fill="#f8fafc">VS Code Quick Start</text>
<text x="720" y="92" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" fill="#94a3b8">standard Remote-SSH · loopback-oriented access · /workspace</text>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
  <g transform="translate(32,130)">
    <rect width="315" height="278" rx="24" fill="#0b1628" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="40" cy="40" r="24" fill="#0ea5e9"/><text x="40" y="49" text-anchor="middle" font-size="25" font-weight="800" fill="#fff">1</text>
    <text x="80" y="49" font-size="24" font-weight="800" fill="#f8fafc">Open Workspace</text>
    <rect x="20" y="82" width="275" height="84" rx="14" fill="#050b14"/><text x="36" y="132" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22" fill="#86efac">$ haco-vscode open .</text>
    <text x="24" y="208" font-size="18" fill="#cbd5e1">Detect the current Workspace.</text><text x="24" y="239" font-size="18" fill="#cbd5e1">Request a safe environment.</text>
  </g>
  <path d="M356 269h42" stroke="url(#a)" stroke-width="7" stroke-linecap="round"/><path d="m389 254 20 15-20 15" fill="none" stroke="#14b8a6" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(414,130)">
    <rect width="315" height="278" rx="24" fill="#0b1628" stroke="#2dd4bf" stroke-width="2"/>
    <circle cx="40" cy="40" r="24" fill="#14b8a6"/><text x="40" y="49" text-anchor="middle" font-size="25" font-weight="800" fill="#fff">2</text>
    <text x="80" y="49" font-size="24" font-weight="800" fill="#f8fafc">Environment</text>
    <rect x="20" y="82" width="275" height="116" rx="14" fill="#071b1e"/>
    <circle cx="44" cy="112" r="7" fill="#4ade80"/><text x="64" y="120" font-size="20" fill="#e2e8f0">create or reuse</text>
    <circle cx="44" cy="152" r="7" fill="#4ade80"/><text x="64" y="160" font-size="20" fill="#e2e8f0">mount /workspace</text>
    <text x="24" y="235" font-size="18" fill="#cbd5e1">Incus is the local default.</text>
  </g>
  <path d="M738 269h42" stroke="url(#a)" stroke-width="7" stroke-linecap="round"/><path d="m771 254 20 15-20 15" fill="none" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(796,130)">
    <rect width="315" height="278" rx="24" fill="#0b1628" stroke="#60a5fa" stroke-width="2"/>
    <circle cx="40" cy="40" r="24" fill="#2563eb"/><text x="40" y="49" text-anchor="middle" font-size="25" font-weight="800" fill="#fff">3</text>
    <text x="80" y="49" font-size="24" font-weight="800" fill="#f8fafc">Loopback SSH</text>
    <rect x="20" y="82" width="275" height="116" rx="14" fill="#071426"/>
    <text x="36" y="122" font-size="18" fill="#93c5fd">alias</text><text x="106" y="122" font-size="18" fill="#e2e8f0">haco-…</text>
    <text x="36" y="160" font-size="18" fill="#93c5fd">root</text><text x="106" y="160" font-size="18" fill="#e2e8f0">/workspace</text>
    <text x="24" y="235" font-size="18" fill="#cbd5e1">Private key stays client-side.</text>
  </g>
  <path d="M1120 269h42" stroke="url(#a)" stroke-width="7" stroke-linecap="round"/><path d="m1153 254 20 15-20 15" fill="none" stroke="#8b5cf6" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(1178,130)">
    <rect width="230" height="278" rx="24" fill="#0b1628" stroke="#8b5cf6" stroke-width="2"/>
    <circle cx="40" cy="40" r="24" fill="#7c3aed"/><text x="40" y="49" text-anchor="middle" font-size="25" font-weight="800" fill="#fff">4</text>
    <text x="80" y="49" font-size="24" font-weight="800" fill="#f8fafc">VS Code</text>
    <rect x="20" y="82" width="190" height="116" rx="14" fill="#111827"/>
    <text x="115" y="124" text-anchor="middle" font-size="19" fill="#c4b5fd">Remote-SSH</text><text x="115" y="161" text-anchor="middle" font-size="21" font-weight="750" fill="#f8fafc">/workspace</text>
    <text x="24" y="235" font-size="18" fill="#cbd5e1">Build. Test. Debug.</text>
  </g>
</g>
<text x="720" y="462" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#94a3b8">The coding agent never needs Hacocoon or Incus management authority.</text>
</svg>