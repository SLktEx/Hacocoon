<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hacocoon Notifications</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <h1>Hacocoon Notifications</h1>
    <p>Browser presentation for minimized Hacocoon interaction events.</p>
    <div class="controls">
      <button id="enable">Enable notifications</button>
      <label><input id="completed" type="checkbox"> Show completed operations</label>
    </div>
    <p id="status">Connecting…</p>
    <ol id="events"></ol>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
