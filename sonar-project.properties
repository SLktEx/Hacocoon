sonar.projectKey=SLktEx_Hacocoon
sonar.organization=slktex
sonar.sourceEncoding=UTF-8
sonar.sources=.
sonar.exclusions=**/*_test.go,test/**,tools/test_*.py,dist/**,release-payload-test/**
sonar.tests=.
sonar.test.inclusions=**/*_test.go,test/**,tools/test_*.py
sonar.go.coverage.reportPaths=coverage.out
# The first coverage gate intentionally measures Go only. Sonar still analyzes
# the other source languages for bugs, smells, duplication, and security.
sonar.coverage.exclusions=**/*.py,**/*.js,**/*.sh,**/*.ps1
