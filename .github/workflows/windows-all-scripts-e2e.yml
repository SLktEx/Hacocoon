name: windows-installer-e2e

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-installer-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-package:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: "[fixture] Checkout candidate"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: "[infrastructure] Set up Go"
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.0
          check-latest: false
          cache: false

      - name: "[infrastructure] Install pinned GoReleaser"
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          install-only: true

      - name: "[fixture] Build release-equivalent candidate artifacts"
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $candidateVersion = "v0.0.0-e2e"
          git tag $candidateVersion $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw "Failed to create local E2E release tag." }

          $releaseConfig = Get-Content -LiteralPath ./.goreleaser.yaml -Raw
          $matrix = "goarch: [amd64, arm64]"
          $matrixCount = ([regex]::Matches($releaseConfig, [regex]::Escape($matrix))).Count
          if ($matrixCount -ne 9) {
            throw "Expected 9 dual-arch GoReleaser build matrices, found $matrixCount; review the E2E projection before changing release config."
          }
          $releaseConfig = $releaseConfig.Replace($matrix, "goarch: [amd64]")
          $e2eConfig = Join-Path $env:RUNNER_TEMP "goreleaser-windows-amd64-e2e.yaml"
          [System.IO.File]::WriteAllText($e2eConfig, $releaseConfig)

          goreleaser release --config $e2eConfig --clean --skip=publish
          if ($LASTEXITCODE -ne 0) { throw "GoReleaser candidate build failed." }
          @(
            "dist/haco_linux_amd64.tar.gz",
            "dist/haco_review_windows_amd64.zip",
            "dist/haco_wsl_windows_amd64.zip",
            "dist/haco_tunnel_windows_amd64.zip",
            "dist/checksums.txt"
          ) | ForEach-Object {
            if (-not (Test-Path -LiteralPath $_ -PathType Leaf)) { throw "Release-equivalent build is missing $_." }
          }
          if (Test-Path -LiteralPath "dist/haco_linux_arm64.tar.gz" -PathType Leaf) {
            throw "amd64-only Windows acceptance unexpectedly built arm64 release artifacts."
          }

      - name: "[fixture] Build and verify release-equivalent Windows package"
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $packageOut = Join-Path $env:RUNNER_TEMP "installer-payload"
          $packageRoot = Join-Path $env:RUNNER_TEMP "hacocoon-windows-amd64"
          Remove-Item -LiteralPath $packageOut -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $packageRoot -Recurse -Force -ErrorAction SilentlyContinue
          python ./tools/package_installers.py --dist ./dist --output $packageOut --version v0.0.0-e2e --arch amd64
          if ($LASTEXITCODE -ne 0) { throw "Failed to build candidate installer package." }
          $zip = Join-Path $packageOut "hacocoon-windows-amd64.zip"
          Expand-Archive -LiteralPath $zip -DestinationPath $packageRoot
          @(
            "install-windows.bat",
            "install-windows.ps1",
            "install.sh",
            "incus-boot-guard.py",
            "haco_linux_amd64.tar.gz",
            "checksums.txt",
            "VERSION"
          ) | ForEach-Object {
            if (-not (Test-Path -LiteralPath (Join-Path $packageRoot $_) -PathType Leaf)) { throw "Candidate package is missing $_." }
          }
          if (Test-Path -LiteralPath (Join-Path $packageRoot "haco_linux_arm64.tar.gz")) { throw "amd64 package contains arm64 payload." }

      - name: "[infrastructure] Publish shared Windows package"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-e2e-package
          path: ${{ runner.temp }}/installer-payload/hacocoon-windows-amd64.zip
          if-no-files-found: error
          retention-days: 1
          overwrite: true

      - name: "[fixture] Record bounded substrate evidence"
        if: always()
        run: python tools/ci_diagnostics.py --output ci-substrate.json
      - name: "[infrastructure] Retain substrate evidence"
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-substrate-${{ github.job }}-${{ github.run_attempt }}
          path: ci-substrate.json
          if-no-files-found: error
          retention-days: 30

  windows-native-client-tests:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: "[fixture] Checkout candidate"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "[infrastructure] Set up Go"
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.0
          check-latest: false
          cache: false

      - name: "[fixture] Test native Windows client boundaries"
        shell: pwsh
        run: |
          go test -v -timeout 3m ./internal/platform/wsl/reclaim ./internal/client/reclaim ./internal/cli/wsl ./internal/cli/review ./internal/client/review ./internal/cli/tunnel ./internal/client/forward ./internal/platform/wsl/launch ./internal/streamio
          if ($LASTEXITCODE -ne 0) { throw "Native Windows client tests failed." }

      - name: "[fixture] Record bounded substrate evidence"
        if: always()
        run: python tools/ci_diagnostics.py --output ci-substrate.json
      - name: "[infrastructure] Retain substrate evidence"
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-substrate-${{ github.job }}-${{ github.run_attempt }}
          path: ci-substrate.json
          if-no-files-found: error
          retention-days: 30

  windows-installer-component-tests:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: "[fixture] Checkout candidate"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "[fixture] Prepare ConPTY user-input driver regressions"
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --disable-pip-version-check --no-input "pywinpty==3.0.2"
          if ($LASTEXITCODE -ne 0) { throw "Failed to install the ConPTY test driver dependency." }
          python -m py_compile ./test/e2e/windows/install.py ./test/e2e/windows/access.py
          if ($LASTEXITCODE -ne 0) { throw "Windows user-path drivers failed syntax validation." }
          python ./tools/test_installed_source_guard.py
          if ($LASTEXITCODE -ne 0) { throw "Source guard observer regressions failed." }
          python ./tools/test_windows_user_path.py
          if ($LASTEXITCODE -ne 0) { throw "Windows user-path assertion regressions failed." }

      - name: "[product] Verify Windows installer components on PowerShell 5.1"
        shell: powershell
        run: |
          python ./tools/test_native_access_runner.py
          if ($LASTEXITCODE -ne 0) { throw "Native acceptance runner regression failed" }
          ./tools/test_windows_installer.ps1
          ./tools/test_wsl_stop_readiness.ps1
          ./tools/test_windows_installer_exit.ps1 -PausePython (Get-Command python).Source
          ./tools/test_windows_dns_diagnostic.ps1
          pwsh -NoLogo -NoProfile -File ./tools/test_windows_ssh_diagnostic.ps1
          pwsh -NoLogo -NoProfile -File ./tools/test_windows_editor_cleanup.ps1
          if ($LASTEXITCODE -ne 0) { throw "SSH diagnostic regressions failed" }

      - name: "[fixture] Record bounded substrate evidence"
        if: always()
        run: python tools/ci_diagnostics.py --output ci-substrate.json
      - name: "[infrastructure] Retain substrate evidence"
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-substrate-${{ github.job }}-${{ github.run_attempt }}
          path: ci-substrate.json
          if-no-files-found: error
          retention-days: 30

  windows-installer-lifecycle:
    needs: [windows-package]
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: "[fixture] Checkout candidate"
