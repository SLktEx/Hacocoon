name: windows-installer-e2e

on:
  pull_request:
    branches: [main]
    paths:
      - "cmd/**"
      - "internal/**"
      - ".goreleaser.yaml"
      - "scripts/install-windows.bat"
      - "scripts/install-windows.ps1"
      - "scripts/install.sh"
      - "tools/package_installers.py"
      - "tools/windows-installer-user-path-e2e.py"
      - ".github/workflows/windows-all-scripts-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-user-path:
    runs-on: windows-latest
    timeout-minutes: 70
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.0
          check-latest: false
          cache: false

      - name: Install pinned GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          install-only: true

      - name: Record Windows and WSL substrate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          wsl.exe --version
          if ($LASTEXITCODE -ne 0) { throw "WSL version query failed." }
          wsl.exe --status
          if ($LASTEXITCODE -ne 0) { throw "WSL status query failed." }
          & wsl.exe --list --verbose 2>&1 | ForEach-Object { Write-Host $_ }
          $global:LASTEXITCODE = 0

      - name: Build release-equivalent candidate artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $candidateVersion = "v0.0.0-e2e"
          git tag $candidateVersion $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw "Failed to create local E2E release tag." }
          goreleaser release --clean --skip=publish
          if ($LASTEXITCODE -ne 0) { throw "GoReleaser candidate build failed." }
          @(
            "dist/haco_linux_amd64.tar.gz",
            "dist/haco_linux_arm64.tar.gz",
            "dist/checksums.txt"
          ) | ForEach-Object {
            if (-not (Test-Path -LiteralPath $_ -PathType Leaf)) {
              throw "Release-equivalent build is missing $_."
            }
          }

      - name: Build and extract release-equivalent Windows package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $packageOut = Join-Path $env:RUNNER_TEMP "installer-payload"
          $packageRoot = Join-Path $env:RUNNER_TEMP "hacocoon-windows-amd64"
          Remove-Item -LiteralPath $packageOut -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $packageRoot -Recurse -Force -ErrorAction SilentlyContinue
          python ./tools/package_installers.py --dist ./dist --output $packageOut --version v0.0.0-e2e --arch amd64
          if ($LASTEXITCODE -ne 0) { throw "Failed to build candidate installer package." }
          $zip = Join-Path $packageOut "hacocoon-windows-amd64.zip"
          Expand-Archive -LiteralPath $zip -DestinationPath $packageRoot
          @(
            "install-windows.bat",
            "install-windows.ps1",
            "install.sh",
            "haco_linux_amd64.tar.gz",
            "checksums.txt",
            "VERSION"
          ) | ForEach-Object {
            if (-not (Test-Path -LiteralPath (Join-Path $packageRoot $_) -PathType Leaf)) {
              throw "Candidate package is missing $_."
            }
          }
          if (Test-Path -LiteralPath (Join-Path $packageRoot "haco_linux_arm64.tar.gz")) {
            throw "amd64 package contains arm64 payload."
          }

      - name: Prepare ConPTY user-input driver
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --disable-pip-version-check --no-input "pywinpty==3.0.2"
          if ($LASTEXITCODE -ne 0) { throw "Failed to install the ConPTY test driver dependency." }
          python -m py_compile ./tools/windows-installer-user-path-e2e.py
          if ($LASTEXITCODE -ne 0) { throw "Windows user-path driver failed syntax validation." }

      - name: Reject Hacocoon test overrides before user path
        shell: pwsh
        run: |
          $overrides = @(Get-ChildItem Env: | Where-Object { $_.Name -like 'HACO_*' })
          if ($overrides.Count -ne 0) {
            $names = ($overrides.Name | Sort-Object) -join ', '
            throw "Exact user-path E2E refuses Hacocoon environment overrides: $names"
          }

      # ACT BOUNDARY:
      # From the first packaged BAT invocation until the user journey completes,
      # product-facing operations are exactly commands a real user can type.
      # No HACO_* rewriting, installer/E2E-only argv/options, CI-created user,
      # sudoers fixture, root WSL state preparation, mount/Incus repair, or
      # synthetic WSL restart is allowed to make the path pass.
      - name: Exercise exact packaged Windows user path
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $packageRoot = Join-Path $env:RUNNER_TEMP "hacocoon-windows-amd64"
          Push-Location $packageRoot
          try {
            python "$env:GITHUB_WORKSPACE\tools\windows-installer-user-path-e2e.py"
            if ($LASTEXITCODE -ne 0) { throw "Exact Windows installer user path failed." }
          } finally {
            Pop-Location
          }

      # ASSERT BOUNDARY:
      # These checks run only after all user-facing product actions have finished.
      # They are read-only observations and must never prepare or repair state for
      # a later product operation.
      - name: Assert installed storage and service state read-only
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $instance = "Hacocoon"
          $project = "hacocoon"
          $pool = "haco-local-default"
          $backing = "/var/lib/incus/disks/haco-local-default.img"
          $mountpoint = "/var/lib/incus/storage-pools/haco-local-default"

          $source = (& wsl.exe --distribution $instance --user root --exec incus storage get $pool source --project $project | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $source -ne $backing) {
            throw "Incus-owned Btrfs backing source is unexpected: '$source'."
          }

          $size = (& wsl.exe --distribution $instance --user root --exec incus storage get $pool size --project $project | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $size -ne "128GiB") {
            throw "Incus-owned Btrfs pool size is unexpected: '$size'."
          }

          $configuredOptions = (& wsl.exe --distribution $instance --user root --exec incus storage get $pool btrfs.mount_options --project $project | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $configuredOptions -ne "compress=zstd:3") {
            throw "Configured Btrfs mount options are unexpected: '$configuredOptions'."
          }
          if ($configuredOptions -match '(^|,)autodefrag(,|$)') {
            throw "Configured Btrfs mount options unexpectedly enable autodefrag."
          }

          $fstype = (& wsl.exe --distribution $instance --user root --exec findmnt -rn -o FSTYPE --mountpoint $mountpoint | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $fstype -ne "btrfs") {
            throw "Incus-owned storage is not mounted as Btrfs: '$fstype'."
          }

          $liveOptions = (& wsl.exe --distribution $instance --user root --exec findmnt -rn -o OPTIONS --mountpoint $mountpoint | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $liveOptions -notmatch '(^|,)compress=zstd(:3)?(,|$)') {
            throw "Live Btrfs mount is missing zstd compression: '$liveOptions'."
          }
          if ($liveOptions -match '(^|,)autodefrag(,|$)') {
            throw "Live Btrfs mount unexpectedly enables autodefrag: '$liveOptions'."
          }

          & wsl.exe --distribution $instance --user root --exec sh -eu -c "test -f '$backing'; test ! -e /var/lib/hacocoon/images/local-default.raw; test ! -e /var/lib/hacocoon/mounts/local-default"
          if ($LASTEXITCODE -ne 0) {
            throw "Fresh Windows install did not keep the Incus-owned storage layout."
          }

          $loopBackings = (& wsl.exe --distribution $instance --user root --exec losetup --list --noheadings --output BACK-FILE | Out-String) -replace "`r", ""
          if ($LASTEXITCODE -ne 0 -or (($loopBackings -split "`n") -notcontains $backing)) {
            throw "Incus Btrfs backing image is not attached to a loop device."
          }

          & wsl.exe --distribution $instance --user root --exec systemctl is-active --quiet haco-controller.service
          if ($LASTEXITCODE -ne 0) { throw "haco-controller is not active after exact user journey." }
          & wsl.exe --distribution $instance --user root --exec test -S /run/hacocoon/control.sock
          if ($LASTEXITCODE -ne 0) { throw "controller socket is unavailable after exact user journey." }

      - name: Collect read-only diagnostics
        if: failure()
        shell: pwsh
        continue-on-error: true
        run: |
          $instance = "Hacocoon"
          & wsl.exe --list --verbose 2>&1 | ForEach-Object { Write-Host $_ }
          $installed = @(& wsl.exe --list --quiet 2>$null | ForEach-Object { ($_ -replace "`0", "").Trim() } | Where-Object { $_ })
          if ($installed -contains $instance) {
            & wsl.exe --distribution $instance --user root --exec sh -lc 'ps -p 1 -o comm=; uname -a; findmnt /var/lib/incus/storage-pools/haco-local-default || true; losetup --list --output NAME,BACK-FILE || true; incus storage show haco-local-default --project hacocoon || true; incus list --all-projects || true; systemctl is-active haco-controller.service || true; systemctl --no-pager --failed || true'
          }
          $global:LASTEXITCODE = 0
