name: windows-all-scripts-e2e

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/**"
      - "tools/package_windows_installer.py"
      - ".github/workflows/windows-all-scripts-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read
  attestations: read

concurrency:
  group: windows-all-scripts-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-all-scripts:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      HACO_E2E_WSL: HacocoonE2E
      HACO_E2E_LOGIN_USER: haco-e2e
      HACO_BOOTSTRAP_LOGIN_USER: haco-e2e
      WSLENV: HACO_BOOTSTRAP_LOGIN_USER
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build candidate Windows installer ZIP
        id: package
        shell: pwsh
        run: |
          $packageRoot = Join-Path $env:RUNNER_TEMP "hacocoon-windows-installer"
          $zip = Join-Path $env:RUNNER_TEMP "hacocoon-windows-installer.zip"
          Remove-Item -LiteralPath $packageRoot -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $zip -Force -ErrorAction SilentlyContinue
          python ./tools/package_windows_installer.py $zip
          if ($LASTEXITCODE -ne 0) { throw "Failed to package candidate Windows installer." }
          Expand-Archive -LiteralPath $zip -DestinationPath $packageRoot
          @("install-windows.bat", "install-windows.ps1", "install.sh") | ForEach-Object {
            if (-not (Test-Path -LiteralPath (Join-Path $packageRoot $_) -PathType Leaf)) {
              throw "Candidate Windows installer is missing $_."
            }
          }
          "package_root=$packageRoot" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Record Windows and WSL substrate
        id: substrate
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Continue"
          Write-Host "Windows:"
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, OsBuildNumber
          Write-Host "Identity:"
          whoami
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [Security.Principal.WindowsPrincipal]::new($identity)
          Write-Host "Administrator: $($principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator))"
          Write-Host "WSL version:"
          wsl.exe --version
          Write-Host "WSL status:"
          wsl.exe --status
          Write-Host "Installed distributions:"
          wsl.exe --list --verbose
          Write-Host "Online distributions:"
          wsl.exe --list --online

      - name: Execute packaged install-windows.bat
        id: install_bat
        shell: cmd
        continue-on-error: true
        working-directory: ${{ steps.package.outputs.package_root }}
        run: install-windows.bat -InstanceName %HACO_E2E_WSL% -BaseDistro Ubuntu-26.04 -WebDownload

      - name: Prepare normal non-root WSL login user fixture
        id: login_user
        shell: pwsh
        continue-on-error: true
        run: |
          $installed = @(& wsl.exe --list --quiet 2>$null | ForEach-Object { ($_ -replace "`0", "").Trim() } | Where-Object { $_ })
          if (-not ($installed -contains $env:HACO_E2E_WSL)) {
            throw "Packaged BAT did not create $env:HACO_E2E_WSL."
          }
          & wsl.exe --distribution $env:HACO_E2E_WSL --user root --exec sh -eu -c "id '$env:HACO_E2E_LOGIN_USER' >/dev/null 2>&1 || useradd -m -s /bin/bash '$env:HACO_E2E_LOGIN_USER'"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to create ordinary WSL login user fixture."
          }
          & wsl.exe --distribution $env:HACO_E2E_WSL --user root --exec id $env:HACO_E2E_LOGIN_USER
          if ($LASTEXITCODE -ne 0) {
            throw "Ordinary WSL login user fixture is unavailable."
          }

      - name: Execute packaged install-windows.ps1
        id: install_ps1
        shell: pwsh
        continue-on-error: true
        working-directory: ${{ steps.package.outputs.package_root }}
        run: |
          & ./install-windows.ps1 `
            -InstanceName $env:HACO_E2E_WSL `
            -BaseDistro Ubuntu-26.04 `
            -HacocoonVersion latest `
            -WebDownload

      - name: Execute bootstrap-windows.ps1
        id: bootstrap_windows
        shell: pwsh
        continue-on-error: true
        run: |
          & ./scripts/bootstrap-windows.ps1 `
            -InstanceName $env:HACO_E2E_WSL `
            -BaseDistro Ubuntu-26.04 `
            -HacocoonVersion latest `
            -WebDownload

      - name: Execute install.sh directly inside WSL
        id: linux_installer
        shell: pwsh
        continue-on-error: true
        run: |
          $linuxRoot = (& wsl.exe --distribution $env:HACO_E2E_WSL --user root --exec wslpath -u -a $env:GITHUB_WORKSPACE | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($linuxRoot)) {
            throw "Unable to translate the checkout path into $env:HACO_E2E_WSL."
          }

          & wsl.exe --distribution $env:HACO_E2E_WSL --user root --exec `
            env "HACO_BOOTSTRAP_LOGIN_USER=$env:HACO_E2E_LOGIN_USER" `
            sh "$linuxRoot/scripts/install.sh" latest
          if ($LASTEXITCODE -eq 42) {
            wsl.exe --terminate $env:HACO_E2E_WSL
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to restart WSL after systemd configuration."
            }
            Start-Sleep -Seconds 1
            & wsl.exe --distribution $env:HACO_E2E_WSL --user root --exec `
              env "HACO_BOOTSTRAP_LOGIN_USER=$env:HACO_E2E_LOGIN_USER" `
              sh "$linuxRoot/scripts/install.sh" latest
          }
          if ($LASTEXITCODE -ne 0) {
            throw "install.sh failed with exit code $LASTEXITCODE."
          }

      - name: Collect post-run diagnostics
        if: always()
        shell: pwsh
        continue-on-error: true
        run: |
          wsl.exe --list --verbose
          wsl.exe --distribution $env:HACO_E2E_WSL --user root --exec sh -lc 'printf "PID1: "; ps -p 1 -o comm=; printf "Kernel: "; uname -a; command -v haco || true; command -v incus || true; systemctl --no-pager --failed || true; incus version || true; haco doctor || true'
          wsl.exe --distribution $env:HACO_E2E_WSL --user root --exec getent passwd $env:HACO_E2E_LOGIN_USER

      - name: Remove E2E WSL distribution
        if: always()
        shell: pwsh
        continue-on-error: true
        run: |
          $installed = @(& wsl.exe --list --quiet 2>$null | ForEach-Object { ($_ -replace "`0", "").Trim() } | Where-Object { $_ })
          if ($installed -contains $env:HACO_E2E_WSL) {
            wsl.exe --terminate $env:HACO_E2E_WSL 2>$null
            wsl.exe --unregister $env:HACO_E2E_WSL
          }

      - name: Require every candidate installer path to execute successfully
        if: always()
        shell: pwsh
        run: |
          $results = [ordered]@{
            package = "${{ steps.package.outcome }}"
            substrate = "${{ steps.substrate.outcome }}"
            install_windows_bat = "${{ steps.install_bat.outcome }}"
            login_user = "${{ steps.login_user.outcome }}"
            install_windows_ps1 = "${{ steps.install_ps1.outcome }}"
            bootstrap_windows_ps1 = "${{ steps.bootstrap_windows.outcome }}"
            install_sh = "${{ steps.linux_installer.outcome }}"
          }
          $results.GetEnumerator() | ForEach-Object { Write-Host "$($_.Key): $($_.Value)" }
          $failed = @($results.GetEnumerator() | Where-Object { $_.Value -ne "success" })
          if ($failed.Count -gt 0) {
            throw "One or more candidate Windows/WSL installer executions failed."
          }
