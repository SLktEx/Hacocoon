name: windows-installer-e2e

on:
  pull_request:
    branches: [main]
    paths:
      - "cmd/**"
      - "internal/**"
      - ".goreleaser.yaml"
      - "scripts/install-windows.bat"
      - "scripts/install-windows.ps1"
      - "scripts/install.sh"
      - "tools/package_installers.py"
      - "tools/windows-installer-user-path-e2e.py"
      - "tools/test_windows_installer.ps1"
      - ".github/workflows/windows-all-scripts-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-user-path:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.0
          check-latest: false
          cache: false

      - name: Install pinned GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          install-only: true

      - name: Record Windows and WSL substrate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          wsl.exe --version
          if ($LASTEXITCODE -ne 0) { throw "WSL version query failed." }
          wsl.exe --status
          if ($LASTEXITCODE -ne 0) { throw "WSL status query failed." }
          & wsl.exe --list --verbose 2>&1 | ForEach-Object { Write-Host $_ }
          $global:LASTEXITCODE = 0

      - name: Build release-equivalent candidate artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $candidateVersion = "v0.0.0-e2e"
          git tag $candidateVersion $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw "Failed to create local E2E release tag." }
          goreleaser release --clean --skip=publish
          if ($LASTEXITCODE -ne 0) { throw "GoReleaser candidate build failed." }
          @(
            "dist/haco_linux_amd64.tar.gz",
            "dist/haco_linux_arm64.tar.gz",
            "dist/checksums.txt"
          ) | ForEach-Object {
            if (-not (Test-Path -LiteralPath $_ -PathType Leaf)) {
              throw "Release-equivalent build is missing $_."
            }
          }
          $listing = tar -tzf dist/haco_linux_amd64.tar.gz
          if ($listing -notcontains "haco") { throw "release archive is missing product haco" }
          if ($listing -notcontains "hacoq") { throw "release archive is missing temporary hacoq" }

      - name: Build and extract release-equivalent Windows installer package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $packageOut = Join-Path $env:RUNNER_TEMP "installer-payload"
          $packageRoot = Join-Path $env:RUNNER_TEMP "hacocoon-windows-amd64"
          Remove-Item -LiteralPath $packageOut -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $packageRoot -Recurse -Force -ErrorAction SilentlyContinue
          python ./tools/package_installers.py --dist ./dist --output $packageOut --version v0.0.0-e2e --arch amd64
          if ($LASTEXITCODE -ne 0) { throw "Failed to build candidate installer package." }
          $zip = Join-Path $packageOut "hacocoon-windows-amd64.zip"
          Expand-Archive -LiteralPath $zip -DestinationPath $packageRoot
          @(
            "install-windows.bat",
            "install-windows.ps1",
            "install.sh",
            "haco_linux_amd64.tar.gz",
            "checksums.txt",
            "VERSION"
          ) | ForEach-Object {
            if (-not (Test-Path -LiteralPath (Join-Path $packageRoot $_) -PathType Leaf)) {
              throw "Candidate package is missing $_."
            }
          }
          foreach ($forbidden in @("haco-windows.cmd", "haco-windows.ps1")) {
            if (Test-Path -LiteralPath (Join-Path $packageRoot $forbidden)) {
              throw "Windows package still contains native haco launcher $forbidden."
            }
          }
          if (Test-Path -LiteralPath (Join-Path $packageRoot "haco_linux_arm64.tar.gz")) {
            throw "amd64 package contains arm64 payload."
          }

      - name: Test Windows installer components on PowerShell 5.1
        shell: powershell
        run: ./tools/test_windows_installer.ps1

      - name: Prepare ConPTY user-input driver
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --no-input "pywinpty==3.0.2"
          if ($LASTEXITCODE -ne 0) { throw "Could not install terminal driver." }
          python -m py_compile ./tools/windows-installer-user-path-e2e.py
          if ($LASTEXITCODE -ne 0) { throw "Invalid terminal driver." }

      - name: Require a fresh dedicated instance
        id: fresh
        shell: pwsh
        run: |
          $names = @(& wsl.exe --list --quiet 2>$null | ForEach-Object { ($_ -replace "`0", "").Trim() })
          if ($names -contains "Hacocoon") { throw "Refusing an existing Hacocoon distribution." }
          "ok=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $global:LASTEXITCODE = 0

      - name: One BAT, ordinary WSL entry, restart, then current-installer rerun
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $driver = Join-Path $env:GITHUB_WORKSPACE "tools/windows-installer-user-path-e2e.py"
          Push-Location (Join-Path $env:RUNNER_TEMP "hacocoon-windows-amd64")
          try {
            python $driver
            if ($LASTEXITCODE -ne 0) { throw "Exact Windows user-path acceptance failed." }
          } finally {
            Pop-Location
          }
      - name: Collect diagnostics
        if: failure()
        shell: pwsh
        continue-on-error: true
        run: |
          $instance = "Hacocoon"
          & wsl.exe --list --verbose 2>&1 | ForEach-Object { Write-Host $_ }
          $installed = @(& wsl.exe --list --quiet 2>$null | ForEach-Object { ($_ -replace "`0", "").Trim() } | Where-Object { $_ })
          if ($installed -contains $instance) {
            wsl.exe --distribution $instance --user root --exec sh -lc 'ps -p 1 -o comm=; uname -a; command -v haco || true; command -v hacoq || true; command -v incus || true; haco --version || true; haco help || true; hacoq doctor || true; hacoq env list || true; systemctl --no-pager --failed || true; incus list --all-projects || true'
          }
          $global:LASTEXITCODE = 0

      - name: Remove Hacocoon WSL distribution
        if: always() && steps.fresh.outputs.ok == 'true'
        shell: pwsh
        continue-on-error: true
        run: |
          $instance = "Hacocoon"
          $installed = @(& wsl.exe --list --quiet 2>$null | ForEach-Object { ($_ -replace "`0", "").Trim() } | Where-Object { $_ })
          if ($installed -contains $instance) {
            wsl.exe --terminate $instance 2>$null
            wsl.exe --unregister $instance
          }
          $global:LASTEXITCODE = 0
