      - name: "[infrastructure] Download shared Windows package"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-e2e-package
          path: ${{ runner.temp }}/windows-e2e-package

      - name: "[infrastructure] Restore trusted Ubuntu 26.04 WSL image cache"
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/hacocoon-wsl-cache/ubuntu.wsl
          key: hacocoon-wsl-${{ runner.os }}-${{ runner.arch }}-ubuntu-26.04-v1

      - name: "[fixture] Stage release-equivalent installer package"
        shell: pwsh
        run: ./tools/stage_windows_installer_e2e.ps1

      - name: "[fixture] Prepare ConPTY user-input driver"
