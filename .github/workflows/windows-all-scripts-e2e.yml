name: windows-installer-e2e

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-user-path:
    runs-on: windows-2025
    timeout-minutes: 70
    steps:
      - name: "[fixture] Checkout candidate"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: "[infrastructure] Set up Go"
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.0
          check-latest: false
          cache: false

      - name: "[fixture] Test native Windows reclamation boundaries"
        shell: pwsh
        run: |
          go test -v -timeout 3m ./internal/wslreclaim ./internal/reclaimclient ./cmd/haco-wsl
          if ($LASTEXITCODE -ne 0) { throw "Native Windows reclamation tests failed." }

      - name: "[infrastructure] Install pinned GoReleaser"
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          install-only: true

      - name: "[infrastructure] Prepare pinned portable VS Code client"
        shell: pwsh
        run: ./tools/setup-vscode-acceptance.ps1

      - name: "[infrastructure] Record Windows and WSL substrate"
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          wsl.exe --version
          if ($LASTEXITCODE -ne 0) { throw "WSL version query failed." }
          wsl.exe --status
          if ($LASTEXITCODE -ne 0) { throw "WSL status query failed." }
          & wsl.exe --list --verbose 2>&1 | ForEach-Object { Write-Host $_ }
          $global:LASTEXITCODE = 0

      - name: "[fixture] Build release-equivalent candidate artifacts"
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $candidateVersion = "v0.0.0-e2e"
          git tag $candidateVersion $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw "Failed to create local E2E release tag." }
          goreleaser release --clean --skip=publish
          if ($LASTEXITCODE -ne 0) { throw "GoReleaser candidate build failed." }
          @(
            "dist/haco_linux_amd64.tar.gz",
            "dist/haco_linux_arm64.tar.gz",
            "dist/checksums.txt"
          ) | ForEach-Object {
            if (-not (Test-Path -LiteralPath $_ -PathType Leaf)) {
              throw "Release-equivalent build is missing $_."
            }
          }

      - name: "[fixture] Build and extract release-equivalent Windows package"
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $packageOut = Join-Path $env:RUNNER_TEMP "installer-payload"
          $packageRoot = Join-Path $env:RUNNER_TEMP "hacocoon-windows-amd64"
          Remove-Item -LiteralPath $packageOut -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $packageRoot -Recurse -Force -ErrorAction SilentlyContinue
          python ./tools/package_installers.py --dist ./dist --output $packageOut --version v0.0.0-e2e --arch amd64
          if ($LASTEXITCODE -ne 0) { throw "Failed to build candidate installer package." }
          $zip = Join-Path $packageOut "hacocoon-windows-amd64.zip"
          Expand-Archive -LiteralPath $zip -DestinationPath $packageRoot
          @(
            "install-windows.bat",
            "install-windows.ps1",
            "install.sh",
            "incus-boot-guard.py",
            "haco_linux_amd64.tar.gz",
            "checksums.txt",
            "VERSION"
          ) | ForEach-Object {
            if (-not (Test-Path -LiteralPath (Join-Path $packageRoot $_) -PathType Leaf)) {
              throw "Candidate package is missing $_."
            }
          }
          if (Test-Path -LiteralPath (Join-Path $packageRoot "haco_linux_arm64.tar.gz")) {
            throw "amd64 package contains arm64 payload."
          }

      - name: "[infrastructure] Restore trusted Ubuntu 26.04 WSL image cache"
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}\hacocoon-wsl-cache\ubuntu.wsl
          key: hacocoon-wsl-${{ runner.os }}-${{ runner.arch }}-ubuntu-26.04-v1

      - name: "[infrastructure] Stage cached WSL image into installer package"
        shell: pwsh
        run: |
          $cachePath = Join-Path $env:RUNNER_TEMP "hacocoon-wsl-cache\ubuntu.wsl"
          $packageRoot = Join-Path $env:RUNNER_TEMP "hacocoon-windows-amd64"
          if (Test-Path -LiteralPath $cachePath -PathType Leaf) {
            Copy-Item -LiteralPath $cachePath -Destination (Join-Path $packageRoot "ubuntu.wsl") -Force
            Write-Host "Using trusted main-branch Ubuntu WSL image cache."
          } else {
            Write-Host "Trusted Ubuntu WSL image cache was not available; installer will perform the verified download."
          }

      - name: "[fixture] Prepare ConPTY user-input driver"
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --disable-pip-version-check --no-input "pywinpty==3.0.2"
          if ($LASTEXITCODE -ne 0) { throw "Failed to install the ConPTY test driver dependency." }
          python -m py_compile ./tools/windows-installer-user-path-e2e.py ./tools/windows-installer-restart-e2e.py ./tools/windows-installer-cached-restart-e2e.py
          if ($LASTEXITCODE -ne 0) { throw "Windows user-path drivers failed syntax validation." }
          python ./tools/test_installed_source_guard.py
          if ($LASTEXITCODE -ne 0) { throw "Source guard observer regressions failed." }
          python ./tools/test_windows_user_path.py
          if ($LASTEXITCODE -ne 0) { throw "Windows user-path assertion regressions failed." }

      - name: "[product] Verify Windows installer components on PowerShell 5.1"
        shell: powershell
        run: |
          python ./tools/test_native_access_runner.py
          if ($LASTEXITCODE -ne 0) { throw "Native acceptance runner regression failed" }
          ./tools/test_windows_installer.ps1
          ./tools/test_windows_installer_exit.ps1
          ./tools/test_windows_dns_diagnostic.ps1
          pwsh -NoLogo -NoProfile -File ./tools/test_windows_ssh_diagnostic.ps1
          if ($LASTEXITCODE -ne 0) { throw "SSH diagnostic regressions failed" }

      - name: "[fixture] Reject Hacocoon test overrides before user path"
        shell: pwsh
        run: |
          $overrides = @(Get-ChildItem Env: | Where-Object { $_.Name -like 'HACO_*' })
          if ($overrides.Count -ne 0) {
            $names = ($overrides.Name | Sort-Object) -join ', '
            throw "Exact user-path E2E refuses Hacocoon environment overrides: $names"
          }

      # ACTION / ASSERTION CONTRACT:
      # - Product-driving actions are only commands a real user types unchanged.
      #   No HACO_* injection/rewriting, E2E-only arguments/options, root repair,
      #   or direct Incus mutation may substitute for a user action.
      # - This regression deliberately includes the exact Windows lifecycle action
      #   `wsl --terminate Hacocoon` after the first successful install and before
      #   any reinstall. Hacocoon must restart and serve implemented haco commands
      #   without install-windows.bat getting a chance to repair state first.
      # - The shipped -UseCachedWslImage option remains part of the repeated
      #   validation path, using only a trusted restored cache or its verified
      #   download fallback.
      # - After an action completes, the driver may run read-only assertions to
      #   inspect the resulting WSL/systemd/Incus/Btrfs/loop state. Assertions may
      #   use root when required to observe state, but must never create, repair,
      #   restart, remount, attach, detach, delete, or otherwise mutate product
      #   state. Product haco exposes help/version and setup/doctor. Trusted-host file
      #   retention here does not establish Environment/Workspace retention or SSH.
      - name: "[product] Exercise cached install, terminate/restart, and reinstall user path"
        id: installed
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $packageRoot = Join-Path $env:RUNNER_TEMP "hacocoon-windows-amd64"
          $logPath = Join-Path $env:RUNNER_TEMP "windows-installer-user-path.log"
          $driverExit = 1

          Push-Location $packageRoot
          try {
            $previousPreference = $ErrorActionPreference
            $ErrorActionPreference = "Continue"
            try {
              Write-Host "=== Exact user-path live log ==="
              python "$env:GITHUB_WORKSPACE\tools\windows-installer-cached-restart-e2e.py" 2>&1 | Tee-Object -FilePath $logPath
              $driverExit = $LASTEXITCODE
            } finally {
              $ErrorActionPreference = $previousPreference
            }
          } finally {
            Pop-Location
          }

          if ($driverExit -ne 0) {
            Write-Host "=== Exact user-path failure tail ==="
            Get-Content -LiteralPath $logPath -Tail 160
            throw "Exact Windows installer user path failed with exit $driverExit."
          }

          Write-Host "=== Exact user-path success tail ==="
          Get-Content -LiteralPath $logPath -Tail 60

      - name: "[product] Verify installed controller Environment HTTPS and direct-egress refusal"
        shell: pwsh
        run: ./tools/test_installed_egress.ps1

      - name: "[product] Verify native Windows interop and strict OpenSSH through ordinary Host entry"
        shell: pwsh
        run: python ./tools/windows-native-access-e2e.py --reclamation-manifest "$env:RUNNER_TEMP/reclamation-fixture.json"

      - name: "[product] Verify installed Linux reclamation stages"
        id: reclamation_linux
        shell: pwsh
        run: python ./tools/windows-reclamation-linux-e2e.py

      - name: "[product] Verify public reclamation through ordinary Host entry"
        id: reclamation
        shell: pwsh
        run: |
          python ./tools/test_reclamation_retention.py
          if ($LASTEXITCODE -ne 0) { throw "Reclamation retention regressions failed." }
          python ./tools/test_reclamation_user_path.py
          if ($LASTEXITCODE -ne 0) { throw "Reclamation observer regressions failed." }
          python ./tools/windows-reclamation-user-path-e2e.py --retention-manifest "$env:RUNNER_TEMP/reclamation-fixture.json"

      # A failed launch may still have a live worker; do not restart WSL then.
      - name: "[product] Verify installed native notification review route"
        shell: pwsh
        run: ./tools/test_windows_native_review.ps1

      - name: Record bounded substrate evidence
        if: always()
        run: python tools/ci_diagnostics.py --output ci-substrate.json
      - name: Retain substrate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-substrate-${{ github.job }}-${{ strategy.job-index || 0 }}-${{ github.run_attempt }}
          path: ci-substrate.json
          if-no-files-found: error
          retention-days: 30
  windows-installer-e2e-evidence:
    needs: [windows-user-path]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify required jobs and same-commit history
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 tools/ci_history.py --gate --output ci-evidence.json
      - name: Retain CI evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-installer-e2e-evidence-${{ github.run_attempt }}
          path: ci-evidence.json
          if-no-files-found: error
          retention-days: 30
