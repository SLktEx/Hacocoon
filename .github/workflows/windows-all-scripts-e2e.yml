name: windows-installer-e2e

on:
  pull_request:
    branches: [main]
    paths:
      - "cmd/**"
      - "internal/**"
      - ".goreleaser.yaml"
      - "scripts/install-windows.bat"
      - "scripts/install-windows.ps1"
      - "scripts/install.sh"
      - "tools/package_installers.py"
      - ".github/workflows/windows-all-scripts-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-user-path:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      GOTOOLCHAIN: local
      HACO_E2E_WSL: HacocoonE2E
      HACO_E2E_LOGIN_USER: haco-e2e
      HACO_BOOTSTRAP_LOGIN_USER: haco-e2e
      HACO_REQUIRE_PROVENANCE: "0"
      HACO_E2E_VERSION: v0.0.0-e2e
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.0
          check-latest: false
          cache: false

      - name: Install pinned GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          install-only: true

      - name: Record Windows and WSL substrate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          wsl.exe --version
          wsl.exe --status
          wsl.exe --list --verbose

      - name: Build release-equivalent candidate artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git tag $env:HACO_E2E_VERSION $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw "Failed to create local E2E release tag." }
          goreleaser release --clean --skip=publish
          if ($LASTEXITCODE -ne 0) { throw "GoReleaser candidate build failed." }
          @(
            "dist/haco_linux_amd64.tar.gz",
            "dist/haco_linux_arm64.tar.gz",
            "dist/checksums.txt"
          ) | ForEach-Object {
            if (-not (Test-Path -LiteralPath $_ -PathType Leaf)) {
              throw "Release-equivalent build is missing $_."
            }
          }

      - name: Build and extract release-equivalent Windows package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $packageOut = Join-Path $env:RUNNER_TEMP "installer-payload"
          $packageRoot = Join-Path $env:RUNNER_TEMP "hacocoon-windows-amd64"
          Remove-Item -LiteralPath $packageOut -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $packageRoot -Recurse -Force -ErrorAction SilentlyContinue
          python ./tools/package_installers.py --dist ./dist --output $packageOut --version $env:HACO_E2E_VERSION --arch amd64
          if ($LASTEXITCODE -ne 0) { throw "Failed to build candidate installer package." }
          $zip = Join-Path $packageOut "hacocoon-windows-amd64.zip"
          Expand-Archive -LiteralPath $zip -DestinationPath $packageRoot
          @(
            "install-windows.bat",
            "install-windows.ps1",
            "install.sh",
            "haco_linux_amd64.tar.gz",
            "checksums.txt",
            "VERSION"
          ) | ForEach-Object {
            if (-not (Test-Path -LiteralPath (Join-Path $packageRoot $_) -PathType Leaf)) {
              throw "Candidate package is missing $_."
            }
          }
          if (Test-Path -LiteralPath (Join-Path $packageRoot "haco_linux_arm64.tar.gz")) {
            throw "amd64 package contains arm64 payload."
          }
          "HACO_E2E_PACKAGE_ROOT=$packageRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: User path phase 1 - run packaged BAT to create WSL
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Push-Location $env:HACO_E2E_PACKAGE_ROOT
          try {
            & cmd.exe /d /c "install-windows.bat -InstanceName $env:HACO_E2E_WSL -BaseDistro Ubuntu-26.04 -WebDownload"
            if ($LASTEXITCODE -ne 0) { throw "Packaged BAT phase 1 failed with exit code $LASTEXITCODE." }
          } finally {
            Pop-Location
          }

      - name: Emulate Ubuntu first-launch user creation
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installed = @(& wsl.exe --list --quiet 2>$null | ForEach-Object { ($_ -replace "`0", "").Trim() } | Where-Object { $_ })
          if (-not ($installed -contains $env:HACO_E2E_WSL)) { throw "Packaged installer did not create the dedicated WSL distribution." }
          & wsl.exe --distribution $env:HACO_E2E_WSL --user root --exec sh -eu -c "id '$env:HACO_E2E_LOGIN_USER' >/dev/null 2>&1 || useradd -m -s /bin/bash '$env:HACO_E2E_LOGIN_USER'"
          if ($LASTEXITCODE -ne 0) { throw "Failed to create ordinary Ubuntu user fixture." }
          $sudoers = "$env:HACO_E2E_LOGIN_USER ALL=(root) NOPASSWD: /usr/bin/apt-get *, /usr/bin/install *, /usr/bin/mkdir *, /usr/bin/tee *, /usr/bin/chmod *, /usr/sbin/usermod *, /usr/bin/systemctl *, /usr/bin/incus *, /usr/bin/stat *, /usr/bin/find *, /usr/bin/chown *, /usr/bin/cp *"
          $sudoers | & wsl.exe --distribution $env:HACO_E2E_WSL --user root --exec sh -eu -c 'cat > /etc/sudoers.d/hacocoon-e2e-bootstrap && chmod 0440 /etc/sudoers.d/hacocoon-e2e-bootstrap && visudo -cf /etc/sudoers.d/hacocoon-e2e-bootstrap >/dev/null'
          if ($LASTEXITCODE -ne 0) { throw "Failed to prepare noninteractive sudo fixture." }

      - name: User path phase 2 - run the same packaged BAT to completion
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Push-Location $env:HACO_E2E_PACKAGE_ROOT
          try {
            & cmd.exe /d /c "install-windows.bat -InstanceName $env:HACO_E2E_WSL -BaseDistro Ubuntu-26.04 -WebDownload"
            if ($LASTEXITCODE -ne 0) { throw "Packaged BAT phase 2 failed with exit code $LASTEXITCODE." }
          } finally {
            Pop-Location
          }

      - name: Assert Hacocoon is usable through the WSL user path
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pid1 = (& wsl.exe --distribution $env:HACO_E2E_WSL --user root --exec sh -c 'ps -p 1 -o comm=' | Out-String).Trim()
          if ($pid1 -ne "systemd") { throw "systemd is not PID 1." }
          & wsl.exe --distribution $env:HACO_E2E_WSL --user root --exec sh -eu -c '. /etc/os-release; [ "$ID" = ubuntu ]; dpkg --compare-versions "$VERSION_ID" ge 26.04; command -v haco; command -v incus; haco version; haco doctor; systemctl is-active --quiet haco-controller.service; test -S /run/hacocoon/control.sock; incus exec haco-host --project hacocoon -- /usr/local/bin/haco-host doctor >/dev/null'
          if ($LASTEXITCODE -ne 0) { throw "Installed Hacocoon user acceptance failed." }
          $shell = (& wsl.exe --distribution $env:HACO_E2E_WSL --user root --exec sh -c "getent passwd '$env:HACO_E2E_LOGIN_USER' | cut -d: -f7" | Out-String).Trim()
          if ($shell -ne "/usr/local/libexec/hacocoon-login") { throw "WSL post-install login integration is incomplete: $shell" }

      - name: Collect diagnostics
        if: failure()
        shell: pwsh
        continue-on-error: true
        run: |
          wsl.exe --list --verbose
          wsl.exe --distribution $env:HACO_E2E_WSL --user root --exec sh -lc 'ps -p 1 -o comm=; uname -a; command -v haco || true; command -v incus || true; haco version || true; haco doctor || true; systemctl --no-pager --failed || true; systemctl status haco-controller.service --no-pager || true; incus list --all-projects || true'

      - name: Remove E2E WSL distribution
        if: always()
        shell: pwsh
        continue-on-error: true
        run: |
          $installed = @(& wsl.exe --list --quiet 2>$null | ForEach-Object { ($_ -replace "`0", "").Trim() } | Where-Object { $_ })
          if ($installed -contains $env:HACO_E2E_WSL) {
            wsl.exe --terminate $env:HACO_E2E_WSL 2>$null
            wsl.exe --unregister $env:HACO_E2E_WSL
          }
