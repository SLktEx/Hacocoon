name: ubuntu-installer-e2e

on:
  pull_request:
    branches:
      - main
    paths:
      - "cmd/**"
      - "internal/**"
      - ".goreleaser.yaml"
      - "scripts/install-ubuntu.sh"
      - "scripts/install.sh"
      - "tools/package_installers.py"
      - "tools/installer-user-journey-e2e.sh"
      - "tools/installer-network-security-e2e.sh"
      - "tools/installer-dhcp-diagnostics.sh"
      - ".github/workflows/ubuntu-installer-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ubuntu-installer-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu-user-path:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    env:
      GOTOOLCHAIN: local
      HACO_E2E_VERSION: v0.0.0-e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.0
          check-latest: false
          cache: false

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          install-only: true

      - name: Record native Ubuntu substrate
        shell: bash
        run: |
          set -euo pipefail
          . /etc/os-release
          printf 'Ubuntu: %s %s\n' "$ID" "$VERSION_ID"
          printf 'PID 1: %s\n' "$(ps -p 1 -o comm= | tr -d '[:space:]')"
          uname -a
          id
          sudo -n true

      - name: Build release-equivalent candidate artifacts
        shell: bash
        run: |
          set -euo pipefail
          git tag "$HACO_E2E_VERSION" "$GITHUB_SHA"
          goreleaser release --clean --skip=publish
          test -f dist/haco_linux_amd64.tar.gz
          test -f dist/haco_linux_arm64.tar.gz
          test -f dist/checksums.txt
          listing="$(tar -tzf dist/haco_linux_amd64.tar.gz)"
          grep -Fx haco <<<"$listing"
          grep -Fx hacoq <<<"$listing"

      - name: Build and extract release-equivalent Ubuntu package
        shell: bash
        run: |
          set -euo pipefail
          package_out="$RUNNER_TEMP/installer-payload"
          package_root="$RUNNER_TEMP/hacocoon-ubuntu-amd64"
          rm -rf "$package_out" "$package_root"
          mkdir -p "$package_root"
          python3 ./tools/package_installers.py \
            --dist ./dist \
            --output "$package_out" \
            --version "$HACO_E2E_VERSION" \
            --arch amd64
          tar -xzf "$package_out/hacocoon-ubuntu-amd64.tar.gz" -C "$package_root"
          test -x "$package_root/install-ubuntu.sh"
          test -x "$package_root/install.sh"
          test -f "$package_root/haco_linux_amd64.tar.gz"
          test -f "$package_root/checksums.txt"
          test -f "$package_root/VERSION"
          test ! -e "$package_root/haco_linux_arm64.tar.gz"
          printf 'HACO_E2E_PACKAGE_ROOT=%s\n' "$package_root" >> "$GITHUB_ENV"

      - name: Execute packaged native Ubuntu installer unchanged
        shell: bash
        run: |
          set -euo pipefail
          cd "$HACO_E2E_PACKAGE_ROOT"
          ./install-ubuntu.sh

      - name: Assert Hacocoon is usable through native Ubuntu user path
        shell: bash
        run: |
          set -euo pipefail
          . /etc/os-release
          test "$ID" = ubuntu
          dpkg --compare-versions "$VERSION_ID" ge 26.04
          test "$(ps -p 1 -o comm= | tr -d '[:space:]')" = systemd
          command -v haco
          command -v hacoq
          command -v incus

          # Product CLI identity/help must work without touching runtime state.
          haco --version
          haco help
          set +e
          haco env >"$RUNNER_TEMP/product-env.out" 2>"$RUNNER_TEMP/product-env.err"
          product_env_code=$?
          set -e
          test "$product_env_code" = 2
          test ! -s "$RUNNER_TEMP/product-env.out"
          grep -Fq 'Usage: haco env create' "$RUNNER_TEMP/product-env.err"

          apparmor_userns=/proc/sys/kernel/apparmor_restrict_unprivileged_unconfined
          if test -e "$apparmor_userns"; then
            test "$(cat "$apparmor_userns")" = 0
            grep -Fx 'kernel.apparmor_restrict_unprivileged_unconfined = 0' /etc/sysctl.d/90-hacocoon-incus-userns.conf
          fi

          login_user="$(id -un)"
          primary_gid="$(id -g "$login_user")"
          access_gid="$(getent group hacocoon | cut -d: -f3)"
          test -n "$access_gid"
          id -nG "$login_user" | tr ' ' '\n' | grep -Fx hacocoon
          test "$(sudo stat -Lc '%u:%g:%a' /run/hacocoon/control.sock)" = "0:$access_gid:660"

          test "$(sudo -u "$login_user" -- id -g)" = "$primary_gid"
          sudo -u "$login_user" -- id -nG | tr ' ' '\n' | grep -Fx hacocoon
          sudo -u "$login_user" -- /usr/local/bin/hacoq doctor

          sudo systemctl is-active --quiet haco-controller.service
          sudo test -S /run/hacocoon/control.sock
          sudo haco setup
          sudo incus exec haco-host --project hacocoon -- /usr/local/bin/haco-host doctor >/dev/null
          sudo incus exec haco-host --project hacocoon -- /usr/local/bin/haco --version >/dev/null
          sudo incus exec haco-host --project hacocoon -- /usr/local/bin/haco-host env list >/dev/null
          test "$(getent passwd "$login_user" | cut -d: -f7)" != /usr/local/libexec/hacocoon-login

      - name: Exercise installed Hacocoon legacy user journey during migration
        shell: bash
        run: |
          set -euo pipefail
          login_user="$(id -un)"
          journey="$GITHUB_WORKSPACE/tools/installer-user-journey-e2e.sh"
          sudo -u "$login_user" -- env HACO_BIN=/usr/local/bin/hacoq bash "$journey"

      - name: Verify installed network isolation and spoofing guards
        shell: bash
        run: |
          set -euo pipefail
          sudo env HACO_BIN=/usr/local/bin/hacoq bash "$GITHUB_WORKSPACE/tools/installer-network-security-e2e.sh"

      - name: Collect diagnostics
        if: failure()
        shell: bash
        continue-on-error: true
        run: |
          haco --version || true
          haco help || true
          sudo hacoq doctor || true
          sudo hacoq env list || true
          getent group hacocoon || true
          id || true
          sudo -u "$(id -un)" -- id || true
          sudo stat -Lc '%U:%G:%a %n' /run/hacocoon/control.sock || true
          sudo env HACO_BIN=/usr/local/bin/hacoq bash "$GITHUB_WORKSPACE/tools/installer-dhcp-diagnostics.sh" || true
          sudo nft list ruleset || true
          systemctl --no-pager --failed || true
          sudo systemctl status haco-controller.service --no-pager || true
          sudo incus list --all-projects || true
          sudo incus network list --project default || true
