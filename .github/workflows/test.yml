name: test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  docs:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 tools/check_docs.py

  workflow-policy:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate workflow trust boundary
        run: python3 tools/check_workflow_policy.py
      - name: Test workflow trust policy
        run: python3 tools/test_workflow_policy.py
      - name: Test public release readiness policy
        run: python3 tools/test_public_release_readiness.py
      - name: Validate Renovate fail-closed policy
        run: python3 tools/check_renovate_policy.py
      - name: Test Renovate policy regressions
        run: python3 tools/test_renovate_policy.py

  release-config:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test release tag trust validation
        run: bash tools/test_release_tag_trust.sh
      - name: Validate release provenance contract
        run: python3 tools/check_release_provenance.py
      - name: Test installer archive safety
        run: bash tools/test_install_archive_safety.sh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
          check-latest: true
          cache: false
      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          install-only: true
      - name: Validate GoReleaser configuration
        run: goreleaser check
      - name: Validate release and WSL shell syntax
        run: bash -n scripts/install.sh scripts/bootstrap-wsl.sh tools/ci-local.sh tools/check_release_tag_trust.sh tools/test_release_tag_trust.sh tools/test_install_archive_safety.sh
      - name: Validate Windows installer syntax and provenance behavior
        shell: pwsh
        run: |
          [scriptblock]::Create((Get-Content -Raw "scripts/bootstrap-windows.ps1")) | Out-Null
          [scriptblock]::Create((Get-Content -Raw "scripts/install-windows.ps1")) | Out-Null
          [scriptblock]::Create((Get-Content -Raw "tools/test_windows_installer_provenance.ps1")) | Out-Null
          & "./tools/test_windows_installer_provenance.ps1"
      - name: Validate dedicated WSL 2 and systemd boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -q -- '--name' scripts/install-windows.ps1
          grep -q 'Hacocoon' scripts/install-windows.ps1
          grep -q -- '--set-version' scripts/install-windows.ps1
          grep -q -- '--set-version' scripts/bootstrap-windows.ps1
          grep -q -- '--terminate' scripts/install-windows.ps1
          grep -q -- '--terminate' scripts/bootstrap-windows.ps1
          grep -q 'systemd=true' scripts/bootstrap-wsl.sh
          grep -q 'systemd-sysv' scripts/bootstrap-wsl.sh
          grep -q 'ps -p 1 -o comm=' scripts/bootstrap-wsl.sh
          ! grep -q -- '--set-default-version' scripts/install-windows.ps1 scripts/bootstrap-windows.ps1
          ! grep -q -- '--shutdown' scripts/install-windows.ps1 scripts/bootstrap-windows.ps1
      - name: Validate Docker compatibility systemd units
        run: bash tools/ci-local.sh systemd
      - name: Dry-run release packaging on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: goreleaser release --snapshot --clean --skip=publish
      - name: Validate release artifacts on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/haco_linux_amd64.tar.gz
          test -f dist/haco_linux_arm64.tar.gz
          test -f dist/checksums.txt

          for archive in dist/haco_linux_amd64.tar.gz dist/haco_linux_arm64.tar.gz; do
            listing="$(tar -tzf "$archive")"
            grep -Fx 'haco' <<<"$listing" >/dev/null
            grep -Fx 'haco-controller' <<<"$listing" >/dev/null
            grep -Fx 'haco-host' <<<"$listing" >/dev/null
            grep -Fx 'haco-vscode' <<<"$listing" >/dev/null
            grep -Fx 'haco-agent-host' <<<"$listing" >/dev/null
            grep -Fx 'haco-notify' <<<"$listing" >/dev/null
            grep -Fx 'haco-storage-helper' <<<"$listing" >/dev/null
          done

          grep -q 'haco_linux_amd64.tar.gz' dist/checksums.txt
          grep -q 'haco_linux_arm64.tar.gz' dist/checksums.txt
          grep -q 'install.sh' dist/checksums.txt
          grep -q 'bootstrap-wsl.sh' dist/checksums.txt
          grep -q 'install-windows.ps1' dist/checksums.txt

  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        goarch:
          - amd64
          - arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
          check-latest: true
          cache: false
      - name: Build linux/${{ matrix.goarch }} binaries
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          mkdir -p "dist/build/${GOOS}-${GOARCH}"
          go build -trimpath -ldflags='-s -w' -o "dist/build/${GOOS}-${GOARCH}/haco" ./cmd/haco
          go build -trimpath -ldflags='-s -w' -o "dist/build/${GOOS}-${GOARCH}/haco-controller" ./cmd/haco-controller
          go build -trimpath -ldflags='-s -w' -o "dist/build/${GOOS}-${GOARCH}/haco-host" ./cmd/haco-host
          go build -trimpath -ldflags='-s -w' -o "dist/build/${GOOS}-${GOARCH}/haco-vscode" ./cmd/haco-vscode
          go build -trimpath -ldflags='-s -w' -o "dist/build/${GOOS}-${GOARCH}/haco-agent-host" ./cmd/haco-agent-host
          go build -trimpath -ldflags='-s -w' -o "dist/build/${GOOS}-${GOARCH}/haco-notify" ./cmd/haco-notify
          go build -trimpath -ldflags='-s -w' -o "dist/build/${GOOS}-${GOARCH}/haco-storage-helper" ./cmd/haco-storage-helper

  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go-version:
          - 1.26.x
          - 1.27.x
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true
          cache: false
      - run: go test -count=1 -shuffle=on ./...
      - run: go vet ./...
      - name: Test Browser and VS Code notification clients
        if: matrix.go-version == '1.27.x'
        run: |
          node --check pkg/interactionhttp/web/app.js
          node --check clients/vscode-notify/extension.js
          node --test test/js/notification_clients.test.js

  race:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
          check-latest: true
          cache: false
      - run: go test -race -count=1 ./...

  e2e:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
          check-latest: true
          cache: false
      - name: Validate E2E shell syntax
        run: bash -n test/e2e/*.sh tools/ci-nerdctl.sh
      - name: Shipped command black-box E2E
        run: bash test/e2e/commands.sh
      - name: Capability E2E
        run: bash test/e2e/capability.sh
      - name: Git/GitHub E2E
        run: bash test/e2e/git_github.sh
      - name: OCI plugin process matrix
        run: bash test/e2e/plugin_oci.sh
      - name: Orchestrator E2E
        env:
          HACO_STORAGE_PRIVILEGE_MODE: direct
        run: bash test/e2e/orchestrator.sh

  oci-nerdctl:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
          check-latest: true
          cache: false
      - name: Validate nerdctl acceptance helpers
        run: bash -n tools/ci-nerdctl.sh test/e2e/oci_nerdctl.sh
      - name: Start preinstalled containerd
        run: |
          command -v containerd
          containerd --version
          sudo systemctl enable --now containerd
      - name: Install pinned nerdctl
        run: bash tools/ci-nerdctl.sh install
      - name: Run real nerdctl/containerd CLI acceptance
        env:
          HACO_E2E_OCI_NERDCTL: "1"
        run: bash test/e2e/oci_nerdctl.sh
