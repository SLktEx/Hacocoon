name: test

on:
  push:
    branches:
      - main
      - dev/1.x
      - dev/v2
      - dev/2.x
  pull_request:
    branches:
      - main
      - dev/1.x
      - dev/v2
      - dev/2.x

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  docs:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "[fixture] Check documentation consistency"
        run: python3 tools/check_docs.py
      - name: "[fixture] Test documentation consistency regressions"
        run: python3 tools/test_check_docs.py

      - name: Record bounded substrate evidence
        if: always()
        run: python tools/ci_diagnostics.py --output ci-substrate.json
      - name: Retain substrate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-substrate-${{ github.job }}-${{ strategy.job-index || 0 }}-${{ github.run_attempt }}
          path: ci-substrate.json
          if-no-files-found: error
          retention-days: 30
  workflow-policy:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: "[fixture] Validate workflow trust boundary"
        run: |
          python3 tools/check_workflow_policy.py
          python3 tools/check_ci_contracts.py
          python3 tools/test_ci_diagnostics.py
          python3 tools/test_ci_cleanup.py
          python3 tools/test_ci_required_tests.py
          python3 tools/test_ci_history.py
          python3 tools/test_ci_contracts.py
      - name: "[fixture] Test workflow trust policy"
        run: |
          python3 tools/test_workflow_policy.py
          python3 tools/test_real_git_push_target.py
      - name: "[fixture] Test public release readiness policy"
        run: python3 tools/test_public_release_readiness.py
      - name: "[fixture] Validate Renovate fail-closed policy"
        run: python3 tools/check_renovate_policy.py
      - name: "[fixture] Test Renovate policy regressions"
        run: python3 tools/test_renovate_policy.py
      - name: "[fixture] Scan complete Git history for secrets"
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

      - name: Record bounded substrate evidence
        if: always()
        run: python tools/ci_diagnostics.py --output ci-substrate.json
      - name: Retain substrate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-substrate-${{ github.job }}-${{ strategy.job-index || 0 }}-${{ github.run_attempt }}
          path: ci-substrate.json
          if-no-files-found: error
          retention-days: 30
  release-config:
    runs-on: ubuntu-26.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "[fixture] Test release tag trust validation"
        run: bash tools/test_release_tag_trust.sh
      - name: "[fixture] Validate release provenance contract"
        run: python3 tools/check_release_provenance.py
      - name: "[fixture] Test installer archive safety"
        run: bash tools/test_install_archive_safety.sh
      - name: "[fixture] Test architecture-specific installer packaging"
        run: python3 tools/test_installer_packages.py
      - name: "[fixture] Test installer identity and managed WSL first launch"
        run: |
          python3 tools/test_install_identity.py
          python3 tools/test_install_network.py
          python3 tools/test_incus_boot_guard.py
          python3 tools/test_windows_user_path.py
          python3 tools/test_wsl_oobe_config.py
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.0
          check-latest: false
          cache: false
      - name: "[infrastructure] Install GoReleaser"
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          install-only: true
      # actionlint 1.7.12 predates the hosted Ubuntu 26.04 label already used by
      # this repository. Suppress only that exact obsolete label diagnostic.
      - name: "[fixture] Validate Actions syntax and expressions"
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck= -pyflakes= -ignore '^label "ubuntu-26.04" is unknown'
      - name: "[fixture] Validate GoReleaser configuration"
        run: goreleaser check
      - name: "[fixture] Validate installer and CI shell syntax"
        run: bash -n scripts/install.sh scripts/install-ubuntu.sh tools/ci-local.sh tools/check_release_tag_trust.sh tools/test_release_tag_trust.sh tools/test_install_archive_safety.sh
      - name: "[fixture] Validate Windows installer syntax"
        shell: pwsh
        run: '[scriptblock]::Create((Get-Content -Raw "scripts/install-windows.ps1")) | Out-Null'
      - name: "[fixture] Validate pre/main/post installer boundary"
        shell: bash
        run: |
          set -euo pipefail
          grep -q -- '--name' scripts/install-windows.ps1
          grep -q -- '--set-version' scripts/install-windows.ps1
          grep -q -- '--terminate' scripts/install-windows.ps1
          grep -q 'systemd=true' scripts/install-windows.ps1
          grep -q 'Running common Ubuntu install.sh' scripts/install-windows.ps1
          grep -q 'HACO_BUNDLE_ROOT' scripts/install-windows.ps1
          grep -q 'this package is for native Ubuntu' scripts/install-ubuntu.sh
          grep -q 'HACO_BUNDLE_ROOT' scripts/install-ubuntu.sh
          grep -q 'Hacocoon common Ubuntu installation complete' scripts/install.sh
          ! grep -q 'WSL_DISTRO_NAME' scripts/install.sh
          ! grep -q 'systemd=true' scripts/install.sh
          ! grep -q 'hacocoon-login' scripts/install.sh
          ! grep -q -- '--set-default-version' scripts/install-windows.ps1
          ! grep -q -- '--shutdown' scripts/install-windows.ps1
      - name: "[fixture] Validate Docker compatibility systemd units"
        run: bash tools/ci-local.sh systemd
      - name: "[product] Dry-run release packaging"
        run: goreleaser release --snapshot --clean --skip=publish
      - name: "[fixture] Validate release artifacts"
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/haco_linux_amd64.tar.gz
          test -f dist/haco_linux_arm64.tar.gz
          test -f dist/checksums.txt
          for archive in dist/haco_linux_amd64.tar.gz dist/haco_linux_arm64.tar.gz; do
            listing="$(tar -tzf "$archive")"
            grep -Fx 'haco' <<<"$listing" >/dev/null
            grep -Fx 'hacoq' <<<"$listing" >/dev/null
            grep -Fx 'haco-controller' <<<"$listing" >/dev/null
            grep -Fx 'haco-host' <<<"$listing" >/dev/null
            grep -Fx 'haco-vscode' <<<"$listing" >/dev/null
            grep -Fx 'haco-agent-host' <<<"$listing" >/dev/null
            grep -Fx 'haco-notify' <<<"$listing" >/dev/null
          done
          rm -rf release-payload-test
          python3 tools/package_installers.py --dist dist --output release-payload-test --version v0.0.0-test
          (cd release-payload-test && sha256sum -c checksums.txt)
          for path in \
            hacocoon-windows-amd64.zip hacocoon-windows-arm64.zip \
            hacocoon-ubuntu-amd64.tar.gz hacocoon-ubuntu-arm64.tar.gz; do
            test -f "release-payload-test/$path"
          done

      - name: Record bounded substrate evidence
        if: always()
        run: python tools/ci_diagnostics.py --output ci-substrate.json
      - name: Retain substrate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-substrate-${{ github.job }}-${{ strategy.job-index || 0 }}-${{ github.run_attempt }}
          path: ci-substrate.json
          if-no-files-found: error
          retention-days: 30
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        goarch:
          - amd64
          - arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.0
          check-latest: false
          cache: false
      - name: "[product] Build Linux binaries"
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          mkdir -p "dist/build/${GOOS}-${GOARCH}"
          go build -trimpath -ldflags='-s -w' -o "dist/build/${GOOS}-${GOARCH}/haco" ./cmd/haco-product
          go build -trimpath -ldflags='-s -w' -o "dist/build/${GOOS}-${GOARCH}/hacoq" ./cmd/haco
          go build -trimpath -ldflags='-s -w' -o "dist/build/${GOOS}-${GOARCH}/haco-controller" ./cmd/haco-controller
          go build -trimpath -ldflags='-s -w' -o "dist/build/${GOOS}-${GOARCH}/haco-host" ./cmd/haco-host
          go build -trimpath -ldflags='-s -w' -o "dist/build/${GOOS}-${GOARCH}/haco-vscode" ./cmd/haco-vscode
          go build -trimpath -ldflags='-s -w' -o "dist/build/${GOOS}-${GOARCH}/haco-agent-host" ./cmd/haco-agent-host
          go build -trimpath -ldflags='-s -w' -o "dist/build/${GOOS}-${GOARCH}/haco-notify" ./cmd/haco-notify

      - name: Record bounded substrate evidence
        if: always()
        run: python tools/ci_diagnostics.py --output ci-substrate.json
      - name: Retain substrate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-substrate-${{ github.job }}-${{ strategy.job-index || 0 }}-${{ github.run_attempt }}
          path: ci-substrate.json
          if-no-files-found: error
          retention-days: 30
  aws-plugin:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "[fixture] Prepare optional AWS SDK test environment"
        run: |
          python3 -m venv "$RUNNER_TEMP/aws-sdk"
          "$RUNNER_TEMP/aws-sdk/bin/pip" install botocore==1.40.76
      - name: "[product] Verify AWS identity, signing scope and redirect refusal without AWS access"
        run: HACO_AWS_TEST_PYTHON="$RUNNER_TEMP/aws-sdk/bin/python" bash tools/ci-local.sh aws

      - name: Record bounded substrate evidence
        if: always()
        run: python tools/ci_diagnostics.py --output ci-substrate.json
      - name: Retain substrate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-substrate-${{ github.job }}-${{ strategy.job-index || 0 }}-${{ github.run_attempt }}
          path: ci-substrate.json
          if-no-files-found: error
          retention-days: 30
  test:
    name: test (${{ matrix.go-series }})
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - go-version: 1.26.7
            go-series: 1.26.x
          - go-version: 1.27.0
            go-series: 1.27.x
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: false
          cache: false
      - name: "[product] Go unit and integration tests"
        run: go test -count=1 -shuffle=615 ./...
      - name: "[fixture] Go static analysis"
        run: go vet ./...
      - name: "[fixture] Test native WSL trusted-host interop"
        run: python3 tools/test_wsl_host_interop.py
      - name: "[fixture] Test trusted-host forwarding in an isolated Linux network"
        run: bash tools/ci-local.sh forwarding
      - name: "[product] Smoke-test the new product CLI without runtime state"
        run: |
          set -euo pipefail
          go build -o "$RUNNER_TEMP/haco" ./cmd/haco-product
          env -u HACO_ROOT -u HACO_CONTROL_SOCKET "$RUNNER_TEMP/haco" --version
          env -u HACO_ROOT -u HACO_CONTROL_SOCKET "$RUNNER_TEMP/haco" help
          if env -u HACO_ROOT -u HACO_CONTROL_SOCKET "$RUNNER_TEMP/haco" env; then
            echo 'unimplemented product command unexpectedly succeeded' >&2
            exit 1
          fi
      - name: "[fixture] Test Browser and VS Code notification clients"
        run: |
          node --check pkg/interactionhttp/web/app.js
          node --check clients/vscode-notify/extension.js
          node --check clients/vscode-notify/review.js
          node --test test/js/notification_clients.test.js test/js/vscode_acceptance.test.js test/js/approval_review.test.js
          python3 tools/test_pending_approvals_test.py
          python3 tools/test_windows_transfer_bundle_copy.py
          python3 tools/test_evacuation_inventory.py
          python3 tools/test_evacuation_associations.py
          python3 tools/test_evacuation_capture.py
          python3 tools/test_evacuation_files.py
          python3 tools/package_vscode_notifications.py "$RUNNER_TEMP/hacocoon-notifications.vsix"
      - name: "[fixture] Test VS Code agent workspace client"
        run: |
          node --check clients/vscode-agent-workspace/agent-workspace.js
          node --check clients/vscode-agent-workspace/tool-contract.js
          node --check clients/vscode-agent-workspace/extension.js
          node --check test/js/agent_workspace_client.test.js
          node --check test/js/agent_workspace_tools.test.js
          node --check test/js/agent_workspace_tool_security.test.js
          node --test test/js/agent_workspace_client.test.js test/js/agent_workspace_tools.test.js test/js/agent_workspace_tool_security.test.js

      - name: Record bounded substrate evidence
        if: always()
        run: python tools/ci_diagnostics.py --output ci-substrate.json
      - name: Retain substrate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-substrate-${{ github.job }}-${{ strategy.job-index || 0 }}-${{ github.run_attempt }}
          path: ci-substrate.json
          if-no-files-found: error
          retention-days: 30
  race:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.0
          check-latest: false
          cache: false
      - name: "[product] Go race tests"
        run: go test -race -count=1 ./...

      - name: Record bounded substrate evidence
        if: always()
        run: python tools/ci_diagnostics.py --output ci-substrate.json
      - name: Retain substrate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-substrate-${{ github.job }}-${{ strategy.job-index || 0 }}-${{ github.run_attempt }}
          path: ci-substrate.json
          if-no-files-found: error
          retention-days: 30
  e2e:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.0
          check-latest: false
          cache: false
      - name: "[fixture] Validate E2E shell syntax"
        run: bash -n test/e2e/*.sh
      - name: "[product] Shipped command black-box E2E"
        run: bash test/e2e/commands.sh
      - name: "[product] Capability E2E"
        run: bash test/e2e/capability.sh
      - name: "[product] Git/GitHub E2E"
        run: bash test/e2e/git_github.sh
      - name: "[product] Orchestrator E2E"
        run: bash test/e2e/orchestrator.sh

      - name: Record bounded substrate evidence
        if: always()
        run: python tools/ci_diagnostics.py --output ci-substrate.json
      - name: Retain substrate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-substrate-${{ github.job }}-${{ strategy.job-index || 0 }}-${{ github.run_attempt }}
          path: ci-substrate.json
          if-no-files-found: error
          retention-days: 30
  test-evidence:
    needs: [docs, workflow-policy, release-config, build, aws-plugin, test, race, e2e]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify required jobs and same-commit history
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 tools/ci_history.py --gate --output ci-evidence.json
      - name: Retain CI evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-evidence-${{ github.run_attempt }}
          path: ci-evidence.json
          if-no-files-found: error
          retention-days: 30
