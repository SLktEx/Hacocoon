name: test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 tools/check_docs.py

  release-config:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
          check-latest: true
          cache: false
      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          install-only: true
      - name: Validate GoReleaser configuration
        run: goreleaser check
      - name: Validate release installer syntax
        run: bash -n scripts/install.sh
      - name: Dry-run release packaging
        run: goreleaser release --snapshot --clean --skip=publish
      - name: Validate release artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/haco_linux_amd64.tar.gz
          test -f dist/haco_linux_arm64.tar.gz
          test -f dist/checksums.txt
          tar -tzf dist/haco_linux_amd64.tar.gz | grep -qx haco
          tar -tzf dist/haco_linux_arm64.tar.gz | grep -qx haco
          grep -q 'haco_linux_amd64.tar.gz' dist/checksums.txt
          grep -q 'haco_linux_arm64.tar.gz' dist/checksums.txt
          grep -q 'install.sh' dist/checksums.txt

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go-version:
          - 1.26.x
          - 1.27.x
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true
          cache: false
      - run: go test -count=1 -shuffle=on ./...
      - run: go vet ./...

  race:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
          check-latest: true
          cache: false
      - run: go test -race -count=1 ./...

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
          check-latest: true
          cache: false
      - name: Validate E2E shell syntax
        run: bash -n test/e2e/*.sh
      - name: Capability E2E
        run: bash test/e2e/capability.sh
      - name: Git/GitHub E2E
        run: bash test/e2e/git_github.sh
      - name: Orchestrator E2E
        run: bash test/e2e/orchestrator.sh
