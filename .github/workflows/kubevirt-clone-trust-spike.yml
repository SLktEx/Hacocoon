name: kubevirt clone trust spike

on:
  push:
    branches:
      - main-kube
    paths:
      - .github/workflows/kubevirt-clone-trust-spike.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kubevirt-clone-trust-spike-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clone-trust:
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start Kubernetes 1.36
        run: |
          set -euxo pipefail
          curl -fsSLo minikube https://storage.googleapis.com/minikube/releases/latest/minikube-linux-amd64
          chmod +x minikube
          sudo install minikube /usr/local/bin/minikube
          minikube start --driver=docker --kubernetes-version=v1.36.2 --cpus=4 --memory=6500mb --wait=all --wait-timeout=8m
          kubectl get nodes -o wide

      - name: Install KubeVirt
        run: |
          set -euxo pipefail
          KUBEVIRT_VERSION="$(curl -fsSL https://storage.googleapis.com/kubevirt-prow/release/kubevirt/kubevirt/stable.txt)"
          echo "KUBEVIRT_VERSION=${KUBEVIRT_VERSION}" >> "$GITHUB_ENV"
          kubectl apply -f "https://github.com/kubevirt/kubevirt/releases/download/${KUBEVIRT_VERSION}/kubevirt-operator.yaml"
          kubectl apply -f "https://github.com/kubevirt/kubevirt/releases/download/${KUBEVIRT_VERSION}/kubevirt-cr.yaml"
          kubectl -n kubevirt patch kubevirt kubevirt --type=merge -p '{"spec":{"configuration":{"developerConfiguration":{"useEmulation":true}}}}'
          kubectl -n kubevirt wait kv kubevirt --for=condition=Available --timeout=10m
          curl -fsSLo virtctl "https://github.com/kubevirt/kubevirt/releases/download/${KUBEVIRT_VERSION}/virtctl-${KUBEVIRT_VERSION}-linux-amd64"
          chmod +x virtctl
          sudo install virtctl /usr/local/bin/virtctl
          virtctl version

      - name: Install CDI and wait for admission API
        run: |
          set -euxo pipefail
          CDI_TAG="$(curl -fsSL -o /dev/null -w '%{url_effective}' https://github.com/kubevirt/containerized-data-importer/releases/latest)"
          CDI_VERSION="${CDI_TAG##*/}"
          echo "CDI_VERSION=${CDI_VERSION}" >> "$GITHUB_ENV"
          kubectl apply -f "https://github.com/kubevirt/containerized-data-importer/releases/download/${CDI_VERSION}/cdi-operator.yaml"
          kubectl apply -f "https://github.com/kubevirt/containerized-data-importer/releases/download/${CDI_VERSION}/cdi-cr.yaml"
          for i in $(seq 1 120); do
            ready=1
            for deployment in cdi-operator cdi-apiserver cdi-deployment cdi-uploadproxy; do
              kubectl -n cdi get deployment "$deployment" >/dev/null 2>&1 || ready=0
            done
            [ "$ready" = 1 ] && break
            sleep 2
          done
          for deployment in cdi-operator cdi-apiserver cdi-deployment cdi-uploadproxy; do
            kubectl -n cdi rollout status deployment/"$deployment" --timeout=10m
          done
          for i in $(seq 1 120); do
            endpoint="$(kubectl -n cdi get endpoints cdi-api -o jsonpath='{.subsets[0].addresses[0].ip}' 2>/dev/null || true)"
            [ -n "$endpoint" ] && break
            sleep 2
          done
          test -n "$endpoint"

      - name: Import persistent Fedora root disk
        run: |
          set -euxo pipefail
          cat <<'EOF' | kubectl apply -f -
          apiVersion: cdi.kubevirt.io/v1beta1
          kind: DataVolume
          metadata:
            name: source-root
          spec:
            source:
              registry:
                url: docker://quay.io/containerdisks/fedora:latest
            storage:
              storageClassName: standard
              accessModes: [ReadWriteOnce]
              resources:
                requests:
                  storage: 6Gi
          EOF
          for i in $(seq 1 180); do
            phase="$(kubectl get dv source-root -o jsonpath='{.status.phase}' 2>/dev/null || true)"
            echo "source-root phase=${phase}"
            [ "$phase" = Succeeded ] && break
            [ "$phase" = Failed ] && exit 1
            sleep 5
          done
          test "$(kubectl get dv source-root -o jsonpath='{.status.phase}')" = Succeeded

      - name: Boot source and create machine-state proof
        run: |
          set -euxo pipefail
          ssh-keygen -q -t ed25519 -N '' -f /tmp/source_key
          SOURCE_PUB="$(cat /tmp/source_key.pub)"
          cat >/tmp/source-vm.yaml <<EOF
          apiVersion: kubevirt.io/v1
          kind: VirtualMachine
          metadata:
            name: source-vm
          spec:
            runStrategy: Always
            template:
              metadata:
                labels:
                  hacocoon.dev/spike: source-trust
              spec:
                domain:
                  resources:
                    requests:
                      memory: 1024Mi
                  devices:
                    disks:
                      - name: rootdisk
                        disk:
                          bus: virtio
                      - name: cloudinit
                        disk:
                          bus: virtio
                terminationGracePeriodSeconds: 0
                volumes:
                  - name: rootdisk
                    persistentVolumeClaim:
                      claimName: source-root
                  - name: cloudinit
                    cloudInitNoCloud:
                      userData: |-
                        #cloud-config
                        user: fedora
                        ssh_authorized_keys:
                          - ${SOURCE_PUB}
          EOF
          kubectl apply -f /tmp/source-vm.yaml
          for i in $(seq 1 120); do kubectl get vmi source-vm >/dev/null 2>&1 && break; sleep 1; done
          kubectl wait vmi/source-vm --for=condition=Ready --timeout=8m

          SSH_OPTS=(-t '-o StrictHostKeyChecking=no' -t '-o UserKnownHostsFile=/dev/null' -t '-o BatchMode=yes' -t '-o ConnectTimeout=5')
          source_ready=0
          for i in $(seq 1 60); do
            if virtctl ssh "${SSH_OPTS[@]}" -i /tmp/source_key fedora@vm/source-vm --command 'true'; then source_ready=1; break; fi
            sleep 3
          done
          test "$source_ready" = 1

          virtctl ssh "${SSH_OPTS[@]}" -i /tmp/source_key fedora@vm/source-vm --command "sudo sh -ceu 'printf etc-state >/etc/hacocoon-clone-proof; install -d /usr/local/share/hacocoon /var/lib/containerd/hacocoon-spike; printf usr-state >/usr/local/share/hacocoon/clone-proof; printf runtime-state >/var/lib/containerd/hacocoon-spike/clone-proof; printf \"[Unit]\\nDescription=Hacocoon clone proof\\n[Service]\\nType=oneshot\\nExecStart=/usr/bin/true\\n[Install]\\nWantedBy=multi-user.target\\n\" >/etc/systemd/system/hacocoon-clone-proof.service; systemctl enable hacocoon-clone-proof.service; setsebool -P virt_qemu_ga_manage_ssh 1 || true'"

          SOURCE_MACHINE_ID="$(virtctl ssh "${SSH_OPTS[@]}" -i /tmp/source_key fedora@vm/source-vm --command 'cat /etc/machine-id' | tr -d '\r\n')"
          SOURCE_HOST_KEY="$(virtctl ssh "${SSH_OPTS[@]}" -i /tmp/source_key fedora@vm/source-vm --command "sudo ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub -E sha256 | awk '{print \\\$2}'" | tr -d '\r\n')"
          test -n "$SOURCE_MACHINE_ID"
          test -n "$SOURCE_HOST_KEY"
          echo "SOURCE_MACHINE_ID=$SOURCE_MACHINE_ID" >> "$GITHUB_ENV"
          echo "SOURCE_HOST_KEY=$SOURCE_HOST_KEY" >> "$GITHUB_ENV"
          echo "source machine-id=$SOURCE_MACHINE_ID host-key=$SOURCE_HOST_KEY"

      - name: Stop source and clone complete root disk
        run: |
          set -euxo pipefail
          virtctl stop source-vm
          for i in $(seq 1 120); do ! kubectl get vmi source-vm >/dev/null 2>&1 && break; sleep 2; done
          ! kubectl get vmi source-vm >/dev/null 2>&1
          cat <<'EOF' | kubectl apply -f -
          apiVersion: cdi.kubevirt.io/v1beta1
          kind: DataVolume
          metadata:
            name: clone-root
          spec:
            source:
              pvc:
                namespace: default
                name: source-root
            storage:
              storageClassName: standard
              accessModes: [ReadWriteOnce]
              resources:
                requests:
                  storage: 6Gi
          EOF
          for i in $(seq 1 180); do
            phase="$(kubectl get dv clone-root -o jsonpath='{.status.phase}' 2>/dev/null || true)"
            echo "clone-root phase=${phase}"
            [ "$phase" = Succeeded ] && break
            [ "$phase" = Failed ] && exit 1
            sleep 5
          done
          test "$(kubectl get dv clone-root -o jsonpath='{.status.phase}')" = Succeeded

      - name: Boot clone with qemu guest-agent managed fresh key
        run: |
          set -euxo pipefail
          ssh-keygen -q -t ed25519 -N '' -f /tmp/clone_key
          kubectl create secret generic clone-access-key --from-file=key1=/tmp/clone_key.pub
          cat >/tmp/clone-vm.yaml <<'EOF'
          apiVersion: kubevirt.io/v1
          kind: VirtualMachine
          metadata:
            name: clone-vm
          spec:
            runStrategy: Always
            template:
              metadata:
                labels:
                  hacocoon.dev/spike: clone-trust
              spec:
                domain:
                  resources:
                    requests:
                      memory: 1024Mi
                  devices:
                    disks:
                      - name: rootdisk
                        disk:
                          bus: virtio
                terminationGracePeriodSeconds: 0
                accessCredentials:
                  - sshPublicKey:
                      source:
                        secret:
                          secretName: clone-access-key
                      propagationMethod:
                        qemuGuestAgent:
                          users:
                            - fedora
                volumes:
                  - name: rootdisk
                    persistentVolumeClaim:
                      claimName: clone-root
          EOF
          kubectl apply -f /tmp/clone-vm.yaml
          for i in $(seq 1 120); do kubectl get vmi clone-vm >/dev/null 2>&1 && break; sleep 1; done
          kubectl wait vmi/clone-vm --for=condition=Ready --timeout=8m
          for i in $(seq 1 120); do
            if kubectl get vmi clone-vm -o json | jq -e '.status.conditions[]? | select(.type=="AgentConnected" and .status=="True")' >/dev/null; then break; fi
            sleep 2
          done
          kubectl get vmi clone-vm -o json | jq -e '.status.conditions[]? | select(.type=="AgentConnected" and .status=="True")'

          SSH_OPTS=(-t '-o StrictHostKeyChecking=no' -t '-o UserKnownHostsFile=/dev/null' -t '-o BatchMode=yes' -t '-o ConnectTimeout=5')
          fresh_key_works=0
          for i in $(seq 1 40); do
            if virtctl ssh "${SSH_OPTS[@]}" -i /tmp/clone_key fedora@vm/clone-vm --command 'true'; then fresh_key_works=1; break; fi
            sleep 3
          done
          test "$fresh_key_works" = 1

          if virtctl ssh "${SSH_OPTS[@]}" -i /tmp/source_key fedora@vm/clone-vm --command 'true'; then
            echo 'ERROR: source SSH key still authenticates after qemuGuestAgent credential sync' >&2
            exit 1
          fi
          echo 'fresh clone key works and source key was revoked'

          virtctl ssh "${SSH_OPTS[@]}" -i /tmp/clone_key fedora@vm/clone-vm --command "sudo sh -ceu 'test \"\$(cat /etc/hacocoon-clone-proof)\" = etc-state; test \"\$(cat /usr/local/share/hacocoon/clone-proof)\" = usr-state; test \"\$(cat /var/lib/containerd/hacocoon-spike/clone-proof)\" = runtime-state; test \"\$(systemctl is-enabled hacocoon-clone-proof.service)\" = enabled'"
          CLONE_MACHINE_ID="$(virtctl ssh "${SSH_OPTS[@]}" -i /tmp/clone_key fedora@vm/clone-vm --command 'cat /etc/machine-id' | tr -d '\r\n')"
          CLONE_HOST_KEY="$(virtctl ssh "${SSH_OPTS[@]}" -i /tmp/clone_key fedora@vm/clone-vm --command "sudo ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub -E sha256 | awk '{print \\\$2}'" | tr -d '\r\n')"
          echo "source machine-id=$SOURCE_MACHINE_ID clone machine-id=$CLONE_MACHINE_ID"
          echo "source host-key=$SOURCE_HOST_KEY clone host-key=$CLONE_HOST_KEY"
          if [ "$CLONE_MACHINE_ID" = "$SOURCE_MACHINE_ID" ]; then echo 'machine-id copied: explicit clone scrub required'; else echo 'machine-id already differs'; fi
          if [ "$CLONE_HOST_KEY" = "$SOURCE_HOST_KEY" ]; then echo 'SSH host key copied: explicit clone scrub required'; else echo 'SSH host key already differs'; fi

      - name: Record trust evidence
        if: always()
        run: |
          set +e
          echo "KubeVirt=${KUBEVIRT_VERSION:-unknown} CDI=${CDI_VERSION:-unknown}"
          kubectl get vm,vmi,dv,pvc,pods -A -o wide
          kubectl describe vmi clone-vm 2>/dev/null | tail -n 120 || true
          kubectl logs -n default -l kubevirt.io=virt-launcher --all-containers=true --tail=500 2>/dev/null | grep -Ei 'access credential|authorized|guest agent|ssh' || true
