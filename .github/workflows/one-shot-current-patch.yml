name: one-shot-current-patch

on:
  push:
    branches:
      - fix/windows-one-shot-current
    paths:
      - .github/workflows/one-shot-current-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/windows-one-shot-current
          fetch-depth: 0

      - name: Apply exact-user one-shot adaptation
        run: python3 .github/one_shot_exact_path_patch.py

      - name: Validate package contract
        run: python3 tools/test_installer_packages.py

      - name: Validate Python driver
        run: python3 -m py_compile tools/windows-installer-user-path-e2e.py

      - name: Validate PowerShell syntax
        shell: pwsh
        run: '[scriptblock]::Create((Get-Content -Raw "scripts/install-windows.ps1")) | Out-Null'

      - name: Validate diff
        run: git diff --check

      - name: Commit validated integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SLktEx"
          git config user.email "85579720+SLktEx@users.noreply.github.com"
          git rm .github/one_shot_exact_path_patch.py
          git add tools/windows-installer-user-path-e2e.py
          git diff --cached --check
          git commit -m "test(windows): prove one-shot exact user path"
          git push origin HEAD:fix/windows-one-shot-current
