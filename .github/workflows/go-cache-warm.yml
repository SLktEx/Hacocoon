name: go-cache-warm

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-cache-warm-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  linux:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
          check-latest: true
          cache: false
      - name: Restore and save trusted Go caches
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: hacocoon-go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            hacocoon-go-${{ runner.os }}-${{ runner.arch }}-
      - name: Warm module and build caches
        run: |
          go mod download
          go test -run '^$' ./...

  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
          check-latest: true
          cache: false
      - name: Restore and save trusted Go caches
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/go/pkg/mod
            ~/AppData/Local/go-build
          key: hacocoon-go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            hacocoon-go-${{ runner.os }}-${{ runner.arch }}-
      - name: Warm Windows module and build caches
        shell: pwsh
        run: |
          go mod download
          if ($LASTEXITCODE -ne 0) { throw "go mod download failed" }
          go test -run '^$' ./internal/wslreclaim ./internal/reclaimclient ./cmd/haco-wsl
          if ($LASTEXITCODE -ne 0) { throw "Windows Go cache warmup failed" }
