name: seed-private-registry-acceptance

on:
  workflow_dispatch:
  push:
    branches:
      - test/239-private-registry-acquisition

permissions:
  contents: read

concurrency:
  group: seed-private-registry-acceptance-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local
  NERDCTL_VERSION: 2.3.5
  NERDCTL_AMD64_SHA256: de3206aeb7cbd5f20f5fb1f55c1e3bf2db1be567812a8a3f5e65eba2488347ee

jobs:
  authenticated-host-acquisition:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
          check-latest: true
          cache: false
      - name: Install and start containerd
        run: |
          sudo apt-get update
          sudo apt-get install -y containerd
          sudo systemctl enable --now containerd
      - name: Install pinned nerdctl
        run: |
          archive="/tmp/nerdctl-${NERDCTL_VERSION}-linux-amd64.tar.gz"
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            "https://github.com/containerd/nerdctl/releases/download/v${NERDCTL_VERSION}/nerdctl-${NERDCTL_VERSION}-linux-amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$NERDCTL_AMD64_SHA256" "$archive" | sha256sum --check --strict
          sudo tar -xzf "$archive" -C /usr/local/bin nerdctl
          nerdctl --version
      - name: Run authenticated private-registry Host acquisition acceptance
        run: |
          sudo --preserve-env=PATH,GOTOOLCHAIN env \
            HACO_E2E_PRIVATE_REGISTRY=1 \
            go test -count=1 -run '^TestPrivateRegistryHostAcquisitionAcceptance$' ./modules/runtime/incus
