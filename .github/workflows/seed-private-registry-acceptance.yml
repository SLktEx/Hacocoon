name: seed-private-registry-acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seed-private-registry-acceptance-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  authenticated-host-acquisition:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
          check-latest: true
          cache: false
      - name: Validate pinned nerdctl installer
        run: bash -n tools/ci-nerdctl.sh
      - name: Start preinstalled containerd
        run: |
          command -v containerd
          containerd --version
          sudo systemctl enable --now containerd
      - name: Install pinned nerdctl
        run: bash tools/ci-nerdctl.sh install
      - name: Run authenticated private-registry Host acquisition acceptance
        run: |
          sudo --preserve-env=PATH,GOTOOLCHAIN env \
            HACO_E2E_PRIVATE_REGISTRY=1 \
            go test -count=1 -run '^TestPrivateRegistryHostAcquisitionAcceptance$' ./modules/runtime/incus
