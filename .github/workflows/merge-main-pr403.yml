name: merge-main-pr403

on:
  push:
    branches:
      - fix/windows-one-shot-bootstrap
    paths:
      - .github/workflows/merge-main-pr403.yml

permissions:
  contents: write

jobs:
  merge:
    if: "${{ github.event.head_commit.message != 'chore: remove temporary PR403 merge helper' }}"
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/windows-one-shot-bootstrap
          fetch-depth: 0
          persist-credentials: true

      - name: Merge current main and preserve both Windows installer fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main

          set +e
          git merge --no-ff --no-commit origin/main
          merge_status=$?
          set -e
          if [[ $merge_status -ne 0 ]]; then
            conflicts="$(git diff --name-only --diff-filter=U | sort)"
            expected='tools/test_installer_packages.py'
            if [[ "$conflicts" != "$expected" ]]; then
              echo "Unexpected merge conflicts:" >&2
              printf '%s\n' "$conflicts" >&2
              exit 1
            fi
            git checkout --ours -- tools/test_installer_packages.py
          fi

          python3 - <<'PY'
          from pathlib import Path

          ps1 = Path('scripts/install-windows.ps1')
          text = ps1.read_text(encoding='utf-8')

          uac_function = '''function Invoke-ElevatedWsl([string[]]$Arguments) {
              $systemWsl = Join-Path ([Environment]::SystemDirectory) "wsl.exe"
              if (-not (Test-Path -LiteralPath $systemWsl -PathType Leaf)) {
                  throw "The system wsl.exe is unavailable at '$systemWsl'."
              }
              Write-Step "Administrator approval is required only to create the dedicated Hacocoon WSL instance. Requesting UAC."
              try {
                  $process = Start-Process -FilePath $systemWsl -ArgumentList $Arguments -Verb RunAs -Wait -PassThru
              } catch {
                  throw "Administrator approval was cancelled or elevation could not be started. The dedicated Hacocoon WSL instance was not created."
              }
              return [int]$process.ExitCode
          }

          '''
          if 'function Invoke-ElevatedWsl' not in text:
              marker = 'function Assert-SafeName([string]$Value, [string]$Label) {'
              if marker not in text:
                  raise SystemExit('unable to locate Assert-SafeName insertion point')
              text = text.replace(marker, uac_function + marker, 1)

          old = '''if (-not ($installed -contains $InstanceName)) {
              if (-not (Test-Administrator)) {
                  throw "Creating the dedicated Hacocoon WSL instance requires an elevated PowerShell."
              }
              Write-Step "Creating dedicated WSL instance '$InstanceName' from '$BaseDistro'"
              $args = @("--install", $BaseDistro, "--name", $InstanceName, "--no-launch")
              if ($WebDownload) { $args += "--web-download" }
              & wsl.exe @args
              if ($LASTEXITCODE -ne 0) {
                  throw "Failed to create '$InstanceName'. Update WSL with 'wsl --update' if named installation is unsupported."
              }
              $createdInstance = $true
          }
          '''
          new = '''if (-not ($installed -contains $InstanceName)) {
              Write-Step "Creating dedicated WSL instance '$InstanceName' from '$BaseDistro'"
              $args = @("--install", $BaseDistro, "--name", $InstanceName, "--no-launch")
              if ($WebDownload) { $args += "--web-download" }

              if (Test-Administrator) {
                  & wsl.exe @args
                  $createExitCode = $LASTEXITCODE
              } else {
                  $createExitCode = Invoke-ElevatedWsl $args
              }
              if ($createExitCode -ne 0) {
                  throw "Failed to create '$InstanceName'. Update WSL with 'wsl --update' if named installation is unsupported."
              }
              $createdInstance = $true
          }
          '''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'Invoke-ElevatedWsl $args' not in text:
              raise SystemExit('unable to locate WSL creation block for UAC merge')
          ps1.write_text(text, encoding='utf-8', newline='\n')

          test = Path('tools/test_installer_packages.py')
          t = test.read_text(encoding='utf-8')
          if 'Windows {arch} package is missing UAC creation behavior' not in t:
              marker = '            required_windows_contract = [\n'
              uac_checks = '''            for required in (
                  "function Invoke-ElevatedWsl",
                  "([Environment]::SystemDirectory)",
                  'Join-Path ([Environment]::SystemDirectory) "wsl.exe"',
                  "Start-Process -FilePath $systemWsl",
                  "-Verb RunAs",
                  "Administrator approval is required only to create",
                  "Invoke-ElevatedWsl $args",
                  "$createExitCode = $LASTEXITCODE",
              ):
                  if required not in windows_installer:
                      raise SystemExit(
                          f"Windows {arch} package is missing UAC creation behavior: {required!r}"
                      )
              if "Creating the dedicated Hacocoon WSL instance requires an elevated PowerShell." in windows_installer:
                  raise SystemExit(f"Windows {arch} package still contains the old elevation hard failure")
              if '$process = Start-Process -FilePath "wsl.exe"' in windows_installer:
                  raise SystemExit(f"Windows {arch} package elevates a PATH-resolved wsl.exe")
              if "$createExitCode = if (Test-Administrator)" in windows_installer:
                  raise SystemExit(
                      f"Windows {arch} package captures wsl.exe stdout into its exit-code variable"
                  )

          '''
              if marker not in t:
                  raise SystemExit('unable to locate installer contract insertion point')
              t = t.replace(marker, uac_checks + marker, 1)
          test.write_text(t, encoding='utf-8', newline='\n')
          PY

          git add -A
          git diff --cached --check
          python3 tools/test_installer_packages.py
          pwsh -NoLogo -NoProfile -Command '[scriptblock]::Create((Get-Content -LiteralPath "scripts/install-windows.ps1" -Raw)) | Out-Null'

          git commit -m "merge main into Windows one-shot bootstrap"
          git push origin HEAD:fix/windows-one-shot-bootstrap
