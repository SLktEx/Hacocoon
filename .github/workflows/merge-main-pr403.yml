name: merge-main-pr403

on:
  push:
    branches:
      - fix/windows-one-shot-bootstrap
    paths:
      - .github/workflows/merge-main-pr403.yml

permissions:
  contents: write

jobs:
  merge:
    if: "${{ github.event.head_commit.message != 'chore: remove temporary PR403 merge helper' }}"
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/windows-one-shot-bootstrap
          fetch-depth: 0
          persist-credentials: true

      - name: Merge current main and preserve both Windows installer fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main

          set +e
          git merge --no-ff --no-commit origin/main
          merge_status=$?
          set -e
          if [[ $merge_status -ne 0 ]]; then
            conflicts="$(git diff --name-only --diff-filter=U | sort)"
            expected='tools/test_installer_packages.py'
            if [[ "$conflicts" != "$expected" ]]; then
              echo "Unexpected merge conflicts:" >&2
              printf '%s\n' "$conflicts" >&2
              exit 1
            fi
            # Keep main's UAC regression checks as the base, then append the
            # one-shot/interactive contracts from this PR below.
            git checkout --theirs -- tools/test_installer_packages.py
          fi

          python3 - <<'PY'
          from pathlib import Path

          ps1 = Path('scripts/install-windows.ps1').read_text(encoding='utf-8')
          required_product_contract = (
              'function Invoke-ElevatedWsl',
              'Invoke-ElevatedWsl $args',
              '[switch]$InteractiveUserSetup',
              '$ManagedLoginUser = "hacocoon"',
              'Ensure-ManagedWslLoginUser',
              'Complete-InteractiveWslUserSetup',
              'Enable-BootstrapSudo',
              'Disable-BootstrapSudo',
              '$OutputEncoding = [Text.UTF8Encoding]::new($false)',
              'Running common Ubuntu install.sh',
          )
          for marker in required_product_contract:
              if marker not in ps1:
                  raise SystemExit(f'merged Windows installer lost required behavior: {marker!r}')
          if 'Creating the dedicated Hacocoon WSL instance requires an elevated PowerShell.' in ps1:
              raise SystemExit('merged Windows installer regressed to pre-UAC creation behavior')

          test_path = Path('tools/test_installer_packages.py')
          text = test_path.read_text(encoding='utf-8')
          if 'Windows installer lost one-shot bootstrap contract' not in text:
              marker = '        with tarfile.open(out / f"hacocoon-ubuntu-{arch}.tar.gz", "r:gz") as tf:\n'
              if marker not in text:
                  raise SystemExit('unable to locate Ubuntu package-test insertion point')
              lines = [
                  '            required_windows_contract = [',
                  '                \'[switch]$InteractiveUserSetup\',',
                  '                \'$ManagedLoginUser = "hacocoon"\',',
                  '                \'Ensure-ManagedWslLoginUser\',',
                  '                \'Complete-InteractiveWslUserSetup\',',
                  '                \'Enable-BootstrapSudo\',',
                  '                \'Disable-BootstrapSudo\',',
                  '                \'$OutputEncoding = [Text.UTF8Encoding]::new($false)\',',
                  '                \'Running common Ubuntu install.sh\',',
                  '            ]',
                  '            for contract_marker in required_windows_contract:',
                  '                if contract_marker not in windows_installer:',
                  '                    raise SystemExit(',
                  '                        f"Windows installer lost one-shot bootstrap contract: {contract_marker!r}"',
                  '                    )',
                  '            forbidden_windows_contract = [',
                  '                "Complete normal Ubuntu user setup, then run this installer again.",',
                  '                "After completing the Ubuntu user setup, run install-windows.bat again.",',
                  '            ]',
                  '            for contract_marker in forbidden_windows_contract:',
                  '                if contract_marker in windows_installer:',
                  '                    raise SystemExit(',
                  '                        f"Windows installer regressed to two-invocation setup: {contract_marker!r}"',
                  '                    )',
                  '',
              ]
              text = text.replace(marker, '\n'.join(lines) + marker, 1)
              test_path.write_text(text, encoding='utf-8', newline='\n')
          PY

          git add -A
          git diff --cached --check
          python3 tools/test_installer_packages.py
          pwsh -NoLogo -NoProfile -Command '[scriptblock]::Create((Get-Content -LiteralPath "scripts/install-windows.ps1" -Raw)) | Out-Null'

          git commit -m "merge main into Windows one-shot bootstrap"
          git push origin HEAD:fix/windows-one-shot-bootstrap
