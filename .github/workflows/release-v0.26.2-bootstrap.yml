name: release-v0.26.2-bootstrap

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-v0.26.2-bootstrap.yml

permissions:
  contents: write

concurrency:
  group: release-v0.26.2-bootstrap
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Create current-main release tag and dispatch trusted release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.26.2
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          current_main_sha="$(gh api "repos/$GITHUB_REPOSITORY/branches/$DEFAULT_BRANCH" --jq '.commit.sha')"
          if [[ "$current_main_sha" != "$GITHUB_SHA" ]]; then
            echo "Refusing bootstrap: main moved from workflow SHA $GITHUB_SHA to $current_main_sha" >&2
            exit 1
          fi

          if tag_json="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" 2>/dev/null)"; then
            tag_sha="$(jq -r '.object.sha' <<<"$tag_json")"
            if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
              echo "Refusing bootstrap: $RELEASE_TAG already points to $tag_sha instead of $GITHUB_SHA" >&2
              exit 1
            fi
            echo "$RELEASE_TAG already points to current main; reusing it."
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$RELEASE_TAG" \
              -f "sha=$GITHUB_SHA"
            echo "Created $RELEASE_TAG at $GITHUB_SHA"
          fi

          gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" \
            -f event_type=release \
            -F "client_payload[tag]=$RELEASE_TAG"
          echo "Dispatched trusted release workflow for $RELEASE_TAG"
