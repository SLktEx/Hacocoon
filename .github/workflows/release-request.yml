name: release-request

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (for example v0.1.1)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-request-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Validate trusted release request
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          if [[ -z "$DEFAULT_BRANCH" ]]; then
            echo "Refusing release request: default branch is unavailable" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "Refusing release request: workflow_dispatch must run from trusted default branch" >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Refusing release request: invalid semantic release tag: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Dispatch trusted release workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" \
            -f event_type=release \
            -F "client_payload[tag]=$RELEASE_TAG"
          echo "Dispatched release workflow for $RELEASE_TAG"
