name: incus-core-e2e

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: incus-core-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  incus-standalone:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      HACO_CI_RUNNER_ENVIRONMENT: github-hosted
    steps:
      - name: "[infrastructure] Check out candidate source"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "[fixture] Validate standalone Incus E2E helpers"
        run: bash -n tools/ci-incus.sh test/e2e/incus_standalone.sh
      - name: "[infrastructure] Install and initialize Incus substrate"
        run: bash tools/ci-incus.sh setup
      - name: "[infrastructure] Verify standalone Incus system containers"
        run: bash tools/ci-incus.sh standalone
      - name: "[fixture] Capture standalone Incus diagnostics"
        if: failure()
        run: bash tools/ci-incus.sh diagnostics
      - name: "[fixture] Upload standalone Incus diagnostics"
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: incus-standalone-diagnostics
          path: ${{ runner.temp }}/incus-diagnostics/
          if-no-files-found: error
          retention-days: 7
      - name: "[fixture] Clean up standalone Incus resources"
        if: always()
        run: bash tools/ci-incus.sh cleanup-standalone

      - name: "[fixture] Record bounded substrate evidence"
        if: always()
        run: python tools/ci_diagnostics.py --output ci-substrate.json
      - name: "[infrastructure] Retain substrate evidence"
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-substrate-${{ github.job }}-${{ strategy.job-index || 0 }}-${{ github.run_attempt }}
          path: |
            ci-substrate.json
            ci-test-results.jsonl
            ci-failure-substrate.json
          if-no-files-found: error
          retention-days: 30
  incus-core-e2e:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      HACO_CI_RUNNER_ENVIRONMENT: github-hosted
    steps:
      - name: "[infrastructure] Check out candidate source"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "[infrastructure] Install pinned Go"
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.0
          check-latest: false
          cache: false
      - name: "[infrastructure] Restore trusted Go caches"
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: hacocoon-go-${{ runner.os }}-${{ runner.arch }}-1.27.0-${{ hashFiles('go.sum') }}
          restore-keys: |
            hacocoon-go-${{ runner.os }}-${{ runner.arch }}-1.27.0-
      - name: "[fixture] Validate Core and CLI E2E helper syntax"
        run: bash -n tools/ci-incus.sh tools/ci-incus-core.sh tools/ci-incus-project-cleanup.sh test/e2e/incus.sh
      - name: "[infrastructure] Prepare proven Incus substrate for Hacocoon Core"
        run: bash tools/ci-incus.sh setup
      - name: "[infrastructure] Allow leased workspace owner in Incus root idmap"
        run: |
          uid="$(id -u)"
          gid="$(id -g)"
          if ! awk -F: -v id="$uid" '$1 == "root" && id >= $2 && id - $2 < $3 { found=1 } END { exit found ? 0 : 1 }' /etc/subuid; then
            printf 'root:%s:1\n' "$uid" | sudo tee -a /etc/subuid >/dev/null
          fi
          if ! awk -F: -v id="$gid" '$1 == "root" && id >= $2 && id - $2 < $3 { found=1 } END { exit found ? 0 : 1 }' /etc/subgid; then
            printf 'root:%s:1\n' "$gid" | sudo tee -a /etc/subgid >/dev/null
          fi
      - name: "[product] Run Hacocoon egress policy against real Incus"
        run: bash tools/ci-incus-core.sh egress
      - name: "[product] Run Hacocoon Core and shipped CLI lifecycle against real Incus"
        run: bash tools/ci-incus.sh core
      - name: "[fixture] Capture Hacocoon and Incus diagnostics"
        if: failure()
        run: |
          bash tools/ci-incus.sh diagnostics
          bash tools/ci-incus-core.sh diagnostics
      - name: "[fixture] Delete CI-owned Incus projects and pools"
        if: always()
        run: bash tools/ci-incus-project-cleanup.sh
      - name: "[fixture] Clean up Hacocoon Core E2E resources"
        if: always()
        run: bash tools/ci-incus.sh cleanup-core

      - name: "[fixture] Record bounded substrate evidence"
        if: always()
        run: python tools/ci_diagnostics.py --output ci-substrate.json
      - name: "[infrastructure] Retain substrate evidence"
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-substrate-${{ github.job }}-${{ strategy.job-index || 0 }}-${{ github.run_attempt }}
          path: |
            ci-substrate.json
            ci-test-results.jsonl
            ci-failure-substrate.json
          if-no-files-found: error
          retention-days: 30
  incus-storage-cli:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    env:
      HACO_CI_RUNNER_ENVIRONMENT: github-hosted
    steps:
      - name: "[infrastructure] Check out candidate source"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "[infrastructure] Install pinned Go"
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.0
          check-latest: false
          cache: false
      - name: "[infrastructure] Restore trusted Go caches"
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: hacocoon-go-${{ runner.os }}-${{ runner.arch }}-1.27.0-${{ hashFiles('go.sum') }}
          restore-keys: |
            hacocoon-go-${{ runner.os }}-${{ runner.arch }}-1.27.0-
      - name: "[fixture] Validate real Incus storage CLI E2E helpers"
        run: |
          bash -n tools/ci-incus-core.sh tools/ci-incus-storage-cli.sh
          python3 tools/test_cleanup_ci_base_asset.py
      - name: "[infrastructure] Prepare real Incus substrate"
        run: |
          printf 'INCUS_CONF=%s/haco-incus-client\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'HACO_CI_INCUS_CONF=%s/haco-incus-client\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          bash tools/ci-incus-core.sh setup
      - name: "[fixture] Prepare normal-user haco CLI acceptance"
        run: bash tools/ci-incus-storage-cli.sh setup
      - name: "[product] Establish normal haco create and run against Incus-owned Btrfs"
        run: bash tools/ci-incus-storage-cli.sh test
      - name: "[product] Verify Incus pool trim retains volume and snapshot"
        run: |
          go test -c -o "$RUNNER_TEMP/reclaim-storage.test" ./internal/adapters/incus
          python3 tools/ci_required_tests.py --expect TestRealIncusPoolTrimPreservesVolumeAndSnapshot -- sudo env HACO_E2E_RECLAIM_TRIM=1 "$RUNNER_TEMP/reclaim-storage.test" -test.run='^TestRealIncusPoolTrimPreservesVolumeAndSnapshot$' -test.v -test.timeout=6m
      - name: "[product] Verify ordinary tar tree capture"
        run: sudo env HACO_E2E_PLAIN_EVACUATION=1 python3 tools/test_evacuation_capture_native.py
      - name: "[fixture] Capture storage CLI diagnostics"
        if: failure()
        run: |
          bash tools/ci-incus-storage-cli.sh diagnostics
          bash tools/ci-incus-core.sh diagnostics
      - name: "[fixture] Clean up storage CLI resources"
        if: always()
        run: bash tools/ci-incus-storage-cli.sh cleanup
      - name: "[fixture] Clean up Incus resources"
        if: always()
        run: bash tools/ci-incus-core.sh cleanup

      - name: "[fixture] Record bounded substrate evidence"
        if: always()
        run: python tools/ci_diagnostics.py --output ci-substrate.json
      - name: "[infrastructure] Retain substrate evidence"
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-substrate-${{ github.job }}-${{ strategy.job-index || 0 }}-${{ github.run_attempt }}
          path: |
            ci-substrate.json
            ci-test-results.jsonl
            ci-failure-substrate.json
          if-no-files-found: error
          retention-days: 30

  incus-host-tooling:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
