name: incus-core-e2e

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - dev/2.x
      - 'codex/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: incus-core-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  incus-standalone:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      HACO_CI_RUNNER_ENVIRONMENT: github-hosted
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate standalone Incus E2E helpers
        run: bash -n tools/ci-incus.sh test/e2e/incus_standalone.sh
      - name: Install and initialize Incus substrate
        run: bash tools/ci-incus.sh setup
      - name: Verify standalone Incus system containers
        run: bash tools/ci-incus.sh standalone
      - name: Capture standalone Incus diagnostics
        if: failure()
        run: bash tools/ci-incus.sh diagnostics
      - name: Upload standalone Incus diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: incus-standalone-diagnostics
          path: ${{ runner.temp }}/incus-diagnostics/
          if-no-files-found: error
          retention-days: 7
      - name: Clean up standalone Incus resources
        if: always()
        run: bash tools/ci-incus.sh cleanup-standalone

  incus-core-e2e:
    needs: incus-standalone
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      HACO_CI_RUNNER_ENVIRONMENT: github-hosted
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
          check-latest: true
          cache: false
      - name: Validate Core and CLI E2E helper syntax
        run: bash -n tools/ci-incus.sh tools/ci-incus-core.sh tools/ci-incus-project-cleanup.sh test/e2e/incus.sh
      - name: Prepare proven Incus substrate for Hacocoon Core
        run: bash tools/ci-incus.sh setup
      - name: Allow leased workspace owner in Incus root idmap
        run: |
          uid="$(id -u)"
          gid="$(id -g)"
          if ! awk -F: -v id="$uid" '$1 == "root" && id >= $2 && id - $2 < $3 { found=1 } END { exit found ? 0 : 1 }' /etc/subuid; then
            printf 'root:%s:1\n' "$uid" | sudo tee -a /etc/subuid >/dev/null
          fi
          if ! awk -F: -v id="$gid" '$1 == "root" && id >= $2 && id - $2 < $3 { found=1 } END { exit found ? 0 : 1 }' /etc/subgid; then
            printf 'root:%s:1\n' "$gid" | sudo tee -a /etc/subgid >/dev/null
          fi
      - name: Run Hacocoon egress policy against real Incus
        run: bash tools/ci-incus-core.sh egress
      - name: Run Hacocoon Core and shipped CLI lifecycle against real Incus
        run: bash tools/ci-incus.sh core
      - name: Capture Hacocoon and Incus diagnostics
        if: failure()
        run: |
          bash tools/ci-incus.sh diagnostics
          bash tools/ci-incus-core.sh diagnostics
      - name: Delete CI-owned Incus projects and pools
        if: always()
        run: bash tools/ci-incus-project-cleanup.sh
      - name: Clean up Hacocoon Core E2E resources
        if: always()
        run: bash tools/ci-incus.sh cleanup-core

  incus-owned-btrfs:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      HACO_CI_RUNNER_ENVIRONMENT: github-hosted
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
          check-latest: true
          cache: false
      - name: Validate real Incus storage CLI E2E helpers
        run: |
          bash -n tools/ci-incus-core.sh tools/ci-incus-storage-cli.sh
          python3 tools/test_cleanup_ci_base_asset.py
      - name: Prepare real Incus substrate
        run: |
          printf 'INCUS_CONF=%s/haco-incus-client\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'HACO_CI_INCUS_CONF=%s/haco-incus-client\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          bash tools/ci-incus-core.sh setup
      - name: Prepare normal-user haco CLI acceptance
        id: reclaim_substrate
        run: bash tools/ci-incus-storage-cli.sh setup
      - name: Run normal haco create and run against Incus-owned Btrfs
        run: bash tools/ci-incus-storage-cli.sh test
      - name: Verify Incus pool trim retains volume and snapshot
        if: ${{ !cancelled() && steps.reclaim_substrate.outcome == 'success' }}
        run: |
          go test -c -o "$RUNNER_TEMP/reclaim-storage.test" ./modules/runtime/incus
          sudo env HACO_E2E_RECLAIM_TRIM=1 "$RUNNER_TEMP/reclaim-storage.test" -test.run='^TestRealIncusPoolTrimPreservesVolumeAndSnapshot$' -test.v -test.timeout=6m
      - name: Verify ordinary tar tree capture
        run: sudo env HACO_E2E_PLAIN_EVACUATION=1 python3 tools/test_evacuation_capture_native.py
      - name: Prepare pinned OCI runtime transfer assets
        run: |
          python3 tools/prepare-oci-runtime-fixture.py "$RUNNER_TEMP/oci-runtime-assets"
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/oci-runtime-assets/oci-transfer-probe" ./modules/runtime/incus/testdata/oci-transfer-probe
      - name: Verify retained Bases, aggregate snapshots and component COW
        run: |
          image="$(incus image list --project hacocoon --format=json | python3 -c 'import json,sys; images=json.load(sys.stdin); print(sorted(i["fingerprint"] for i in images if i.get("type") == "container")[0])')"
          go build -o "$RUNNER_TEMP/snapshot-cli" ./cmd/haco-product
          go build -o "$RUNNER_TEMP/import-controller" ./cmd/haco-controller
          go test -c -o "$RUNNER_TEMP/snapshot-storage.test" ./modules/runtime/incus
          sudo env HACO_E2E_BASE_ASSET=1 HACO_E2E_SNAPSHOT_VOLUME=1 HACO_E2E_SNAPSHOT_ROOTFS=1 HACO_E2E_SNAPSHOT_BASE=1 HACO_E2E_SNAPSHOT_AGGREGATE=1 HACO_E2E_WORKSPACE_DELETE=1 \
            HACO_E2E_SNAPSHOT_CLI="$RUNNER_TEMP/snapshot-cli" \
            HACO_E2E_IMPORT_CONTROLLER="$RUNNER_TEMP/import-controller" GITHUB_ACTIONS=true HACO_CI_RUNNER_ENVIRONMENT=github-hosted \
            HACO_E2E_TRANSFER_OCI=1 HACO_E2E_OCI_RUNTIME_ASSETS="$RUNNER_TEMP/oci-runtime-assets" \
            HACO_E2E_INCUS_RESUME_IMAGE="$image" HACO_E2E_INCUS_RESUME_POOL=haco-local-default \
            "$RUNNER_TEMP/snapshot-storage.test" -test.run='^TestRealIncus(BaseAsset|WorkspaceDeletion|SourceDeletion|Snapshot(Volumes|Rootfs|Base|Aggregate))E2E$' -test.v -test.timeout=25m
      - name: Verify owned native volume import
        run: |
          sudo env HACO_E2E_INCUS_VOLUME_IMPORT=1 "$RUNNER_TEMP/snapshot-storage.test" -test.run='^TestRealIncusOwnedVolumeImportE2E$' -test.v -test.timeout=7m
      - name: Verify definition-driven Base build and immutable revisions
        run: |
          image="$(incus image list --project hacocoon --format=json | python3 -c 'import json,sys; images=json.load(sys.stdin); print(sorted(i["fingerprint"] for i in images if i.get("type") == "container")[0])')"
          sudo env HACO_E2E_BASE_BUILD=1 HACO_E2E_SNAPSHOT_CLI="$RUNNER_TEMP/snapshot-cli" \
            HACO_E2E_INCUS_RESUME_IMAGE="$image" HACO_E2E_INCUS_RESUME_POOL=haco-local-default \
            "$RUNNER_TEMP/snapshot-storage.test" -test.run='^TestRealIncusBaseBuildE2E$' -test.v -test.timeout=12m
      - name: Verify independent persistent Store COW with real Btrfs
        run: |
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/oci-runtime-assets/oci-probe" ./modules/runtime/incus/testdata/oci-probe
          go test -c -o "$RUNNER_TEMP/persistent-copy.test" ./modules/runtime/incus
          sudo env HACO_E2E_INCUS_PERSISTENT_COPY=1 HACO_E2E_INCUS_HOST_AREA_COPY=1 HACO_E2E_INCUS_VOLUME_TRANSFER=1 HACO_E2E_READABLE_DATA_EVACUATION=1 HACO_E2E_SAVED_READABLE_DATA_EVACUATION=1 HACO_E2E_FAILED_DELETE_EVACUATION=1 HACO_E2E_INCUS_ROOTFS_TRANSFER=1 HACO_E2E_SAVED_ROOTFS_EVACUATION=1 \
            HACO_E2E_OCI_RUNTIME_ASSETS="$RUNNER_TEMP/oci-runtime-assets" \
            "$RUNNER_TEMP/persistent-copy.test" -test.run='^TestRealIncus(PersistentCopy|HostAreaCopy|CompletedHostCopyRecovery|VolumeTransfer|ReadableDataEvacuation|SavedReadableDataEvacuation|FailedDeleteReadableDataEvacuation|RootfsTransfer|SavedRootfsEvacuation|SnapshotRootfsExport|OwnedVolumeExport)E2E$' -test.v -test.timeout=22m
      - name: Verify retained Store maintenance through native adapter and controller CLI
        run: |
          go build -o "$RUNNER_TEMP/maintenance-controller" ./cmd/haco-controller
          incus image copy images:ubuntu/26.04 haco-ci: --target-project hacocoon --alias haco-maintenance-fixture-base
          image="$(incus image list --project hacocoon --format=json | python3 -c 'import json,sys; rows=[i for i in json.load(sys.stdin) if i.get("type") == "container" and any(a.get("name") == "haco-maintenance-fixture-base" for a in i.get("aliases", []))]; assert len(rows) == 1; print(rows[0]["fingerprint"])')"
          sudo env HACO_E2E_RESOURCE_MAINTENANCE=1 GITHUB_ACTIONS=true HACO_CI_RUNNER_ENVIRONMENT=github-hosted \
            HACO_E2E_MAINTENANCE_CONTROLLER="$RUNNER_TEMP/maintenance-controller" HACO_E2E_MAINTENANCE_CLI="$RUNNER_TEMP/snapshot-cli" \
            HACO_E2E_INCUS_RESUME_IMAGE="$image" HACO_E2E_INCUS_RESUME_POOL=haco-local-default \
            HACO_E2E_OCI_RUNTIME_ASSETS="$RUNNER_TEMP/oci-runtime-assets" \
            "$RUNNER_TEMP/persistent-copy.test" -test.run='^TestRealIncusResourceMaintenancePreparationE2E$' -test.v -test.timeout=22m
      - name: Capture storage CLI diagnostics
        if: failure()
        run: |
          bash tools/ci-incus-storage-cli.sh diagnostics
          bash tools/ci-incus-core.sh diagnostics
      - name: Clean up storage CLI resources
        if: always()
        run: bash tools/ci-incus-storage-cli.sh cleanup
      - name: Clean up Incus resources
        if: always()
        run: bash tools/ci-incus-core.sh cleanup

  authenticated-private-registry:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      NERDCTL_VERSION: 2.3.5
      NERDCTL_AMD64_SHA256: de3206aeb7cbd5f20f5fb1f55c1e3bf2db1be567812a8a3f5e65eba2488347ee
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
          check-latest: true
          cache: false
      - name: Start preinstalled containerd
        run: |
          command -v containerd
          containerd --version
          sudo systemctl enable --now containerd
      - name: Install pinned nerdctl
        run: |
          archive="/tmp/nerdctl-${NERDCTL_VERSION}-linux-amd64.tar.gz"
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            "https://github.com/containerd/nerdctl/releases/download/v${NERDCTL_VERSION}/nerdctl-${NERDCTL_VERSION}-linux-amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$NERDCTL_AMD64_SHA256" "$archive" | sha256sum --check --strict
          sudo tar -xzf "$archive" -C /usr/local/bin nerdctl
          nerdctl --version
      - name: Run authenticated private-registry Host acquisition acceptance
        run: |
          sudo --preserve-env=PATH,GOTOOLCHAIN env \
            HACO_E2E_PRIVATE_REGISTRY=1 \
            go test -count=1 -run '^TestPrivateRegistryHostAcquisitionAcceptance$' ./modules/runtime/incus
