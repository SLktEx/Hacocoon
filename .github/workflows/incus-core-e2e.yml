          python3 tools/ci_required_tests.py --expect TestRealIncusHostToolingE2E -- sudo env HACO_E2E_HOST_TOOLING=1 \
            "$RUNNER_TEMP/persistent-copy.test" -test.run='^TestRealIncusHostToolingE2E$' -test.v -test.timeout=18m
