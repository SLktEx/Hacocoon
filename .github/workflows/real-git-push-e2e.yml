name: real-git-push-e2e

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: real-git-push-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  real-git-push:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
          check-latest: true
          cache: false
      - name: Verify real brokered GitHub push
        env:
          HACO_GITHUB_TOKEN: ${{ github.token }}
        run: bash test/e2e/git_github_real_push.sh
