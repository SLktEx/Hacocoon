name: cleanup-obsolete-action-logs

on:
  push:
    branches:
      - ci/cleanup-obsolete-action-logs
    paths:
      - .github/workflows/cleanup-obsolete-action-logs.yml

permissions:
  actions: write
  contents: read

concurrency:
  group: cleanup-obsolete-action-logs
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Delete logs from retired workflows
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          ids_file="$(mktemp)"
          results_file="$(mktemp)"
          trap 'rm -f "$ids_file" "$results_file"' EXIT

          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" \
            --jq '.workflow_runs[] |
              select(
                .name == "secret-scan" or
                .name == "vscode-agent-workspace" or
                .name == "release-request" or
                .name == "release-v0.1.4-bootstrap" or
                .name == "release-v0.1.5-bootstrap" or
                .name == "seed-private-registry-acceptance"
              ) |
              .id' \
            | sort -nu > "$ids_file"

          count="$(wc -l < "$ids_file" | tr -d ' ')"
          echo "Found $count retired workflow runs whose logs should be removed."

          delete_log() {
            run_id="$1"
            response="$(mktemp)"
            trap 'rm -f "$response"' RETURN

            for attempt in 1 2 3 4; do
              status="$(curl --silent --show-error \
                --output "$response" \
                --write-out '%{http_code}' \
                --request DELETE \
                --header 'Accept: application/vnd.github+json' \
                --header "Authorization: Bearer $GH_TOKEN" \
                --header 'X-GitHub-Api-Version: 2022-11-28' \
                "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/logs")"

              case "$status" in
                204)
                  printf 'deleted\n'
                  return 0
                  ;;
                404)
                  printf 'already-absent\n'
                  return 0
                  ;;
                403|429|5??)
                  sleep "$((attempt * 2))"
                  ;;
                *)
                  echo "Unexpected HTTP $status deleting logs for run $run_id" >&2
                  cat "$response" >&2 || true
                  return 1
                  ;;
              esac
            done

            echo "Failed deleting logs for run $run_id after retries" >&2
            return 1
          }
          export -f delete_log
          export GH_TOKEN GITHUB_API_URL GITHUB_REPOSITORY

          xargs -r -n1 -P4 bash -c 'delete_log "$1"' _ < "$ids_file" > "$results_file"

          deleted="$(grep -c '^deleted$' "$results_file" || true)"
          already_absent="$(grep -c '^already-absent$' "$results_file" || true)"
          echo "Deleted logs for $deleted runs; $already_absent runs already had no logs."
          test "$((deleted + already_absent))" -eq "$count"
