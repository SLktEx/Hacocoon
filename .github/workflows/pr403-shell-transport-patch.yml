name: pr403-shell-transport-patch

on:
  push:
    branches:
      - fix/windows-one-shot-bootstrap
    paths:
      - .github/workflows/pr403-shell-transport-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/windows-one-shot-bootstrap
          fetch-depth: 0

      - name: Apply shell transport hardening
        run: python3 .github/pr403_shell_transport_patch.py

      - name: Validate package contract
        run: python3 tools/test_installer_packages.py

      - name: Validate PowerShell syntax
        shell: pwsh
        run: '[scriptblock]::Create((Get-Content -Raw "scripts/install-windows.ps1")) | Out-Null'

      - name: Commit validated fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SLktEx"
          git config user.email "85579720+SLktEx@users.noreply.github.com"
          git rm .github/pr403_shell_transport_patch.py
          git add scripts/install-windows.ps1 tools/test_installer_packages.py
          git diff --cached --check
          git commit -m "fix(windows): separate shell source from WSL stdin"
          git push origin HEAD:fix/windows-one-shot-bootstrap
