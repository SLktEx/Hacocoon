name: vscode-agent-workspace

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check VS Code agent workspace client syntax
        run: |
          node --check clients/vscode-agent-workspace/agent-workspace.js
          node --check clients/vscode-agent-workspace/extension.js
          node --check test/js/agent_workspace_client.test.js
      - name: Test VS Code agent workspace client
        run: node --test test/js/agent_workspace_client.test.js
