name: pr403-sudo-provider-patch

on:
  push:
    branches:
      - fix/windows-one-shot-bootstrap
    paths:
      - .github/workflows/pr403-sudo-provider-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/windows-one-shot-bootstrap
          fetch-depth: 0

      - name: Detect the active Ubuntu sudo provider from alternatives target
        shell: python
        run: |
          from pathlib import Path

          installer_path = Path("scripts/install-windows.ps1")
          installer = installer_path.read_text(encoding="utf-8")
          old = '''function Get-ActiveSudoersPolicy([string]$Name) {
              $provider = Invoke-WslCapture @("--distribution", $Name, "--user", "root", "--exec", "sudo", "--version")
              if ($provider.ExitCode -ne 0) {
                  throw "Unable to determine the active sudo provider: $($provider.Stderr)"
              }
              if ($provider.Stdout -match '^sudo-rs') {
                  $probe = Invoke-WslCapture @("--distribution", $Name, "--user", "root", "--exec", "test", "-f", "/etc/sudoers-rs")
                  if ($probe.ExitCode -eq 0) { return "/etc/sudoers-rs" }
              }
              return "/etc/sudoers"
          }
          '''
          new = '''function Get-ActiveSudoersPolicy([string]$Name) {
              # Ubuntu 26.04 selects sudo-rs vs sudo.ws through update-alternatives.
              # Do not infer the provider from human-facing --version text; inspect
              # the resolved alternative target instead.
              $provider = Invoke-WslCapture @("--distribution", $Name, "--user", "root", "--exec", "readlink", "-f", "/usr/bin/sudo")
              if ($provider.ExitCode -ne 0 -or [string]::IsNullOrWhiteSpace($provider.Stdout)) {
                  throw "Unable to determine the active sudo provider target: $($provider.Stderr)"
              }

              if ($provider.Stdout -eq "/usr/lib/cargo/bin/sudo") {
                  $probe = Invoke-WslCapture @("--distribution", $Name, "--user", "root", "--exec", "test", "-f", "/etc/sudoers-rs")
                  if ($probe.ExitCode -eq 0) { return "/etc/sudoers-rs" }
                  if ($probe.ExitCode -ne 1) {
                      throw "Failed to inspect sudo-rs policy file: $($probe.Stderr)"
                  }
              }

              $probe = Invoke-WslCapture @("--distribution", $Name, "--user", "root", "--exec", "test", "-f", "/etc/sudoers")
              if ($probe.ExitCode -eq 0) { return "/etc/sudoers" }
              throw "No supported active sudo policy file was found for provider '$($provider.Stdout)'."
          }
          '''
          if installer.count(old) != 1:
              raise SystemExit("Get-ActiveSudoersPolicy block mismatch")
          installer_path.write_text(installer.replace(old, new), encoding="utf-8", newline="\n")

          test_path = Path("tools/test_installer_packages.py")
          test = test_path.read_text(encoding="utf-8")
          anchor = "                'Get-ActiveSudoersPolicy',\n"
          addition = (
              "                '\"readlink\", \"-f\", \"/usr/bin/sudo\"',\n"
              "                '/usr/lib/cargo/bin/sudo',\n"
              "                '/etc/sudoers-rs',\n"
          )
          if test.count(anchor) != 1:
              raise SystemExit("installer contract anchor mismatch")
          test_path.write_text(test.replace(anchor, anchor + addition), encoding="utf-8", newline="\n")

      - name: Commit fix and remove temporary helper
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/pr403-sudo-provider-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/install-windows.ps1 tools/test_installer_packages.py .github/workflows/pr403-sudo-provider-patch.yml
          git diff --cached --check
          git commit -m "fix(windows): resolve active sudo provider via alternatives"
          git push origin HEAD:fix/windows-one-shot-bootstrap
