name: pr403-root-install-patch

on:
  push:
    branches:
      - fix/windows-one-shot-bootstrap
    paths:
      - .github/workflows/pr403-root-install-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/windows-one-shot-bootstrap
          fetch-depth: 0

      - name: Apply root-orchestrated WSL bootstrap
        shell: python
        run: |
          from pathlib import Path
          import re

          installer_path = Path("scripts/install-windows.ps1")
          installer = installer_path.read_text(encoding="utf-8")

          old = '$BootstrapSudoersPath = "/etc/sudoers.d/hacocoon-bootstrap"\n'
          if installer.count(old) != 1:
              raise SystemExit("bootstrap sudoers constant mismatch")
          installer = installer.replace(old, "")

          pattern = re.compile(
              r'\nfunction Enable-BootstrapSudo\(\[string\]\$Name, \[string\]\$LoginUser\) \{.*?\n\}\n\n'
              r'function Disable-BootstrapSudo\(\[string\]\$Name\) \{.*?\n\}\n\n'
              r'function Get-OsReleaseValue',
              re.S,
          )
          installer, count = pattern.subn('\nfunction Get-OsReleaseValue', installer)
          if count != 1:
              raise SystemExit(f"bootstrap sudo helper removal count={count}")

          marker = 'function Configure-WslPost([string]$Name, [string]$LoginUser) {'
          if installer.count(marker) != 1:
              raise SystemExit("Configure-WslPost marker mismatch")
          helper = r'''function Ensure-SudoersDropInSupport([string]$Name) {
              $script = @'
          set -eu
          install -d -o root -g root -m 0755 /etc/sudoers.d
          if grep -Eq '^[[:space:]]*(@includedir|#includedir)[[:space:]]+/etc/sudoers\.d([[:space:]]|$)' /etc/sudoers; then
            exit 0
          fi
          printf '\n@includedir /etc/sudoers.d\n' >> /etc/sudoers
          '@
              $probe = Invoke-WslCaptureWithInput @(
                  "--distribution", $Name,
                  "--user", "root",
                  "--exec", "sh", "-s"
              ) $script
              if ($probe.ExitCode -ne 0) { throw "Failed to enable sudoers.d support: $($probe.Stderr)" }
              $probe = Invoke-WslCapture @("--distribution", $Name, "--user", "root", "--exec", "/usr/sbin/visudo", "-c")
              if ($probe.ExitCode -ne 0) { throw "Failed to validate sudo policy after enabling sudoers.d: $($probe.Stderr)" }
          }

          '''
          # Normalize indentation introduced only for Python readability.
          helper = re.sub(r'^          ', '', helper, flags=re.M)
          installer = installer.replace(marker, helper + marker)

          old = '    Write-Step "Configuring WSL login to enter trusted haco-host"\n'
          new = old + '    Ensure-SudoersDropInSupport $Name\n'
          if installer.count(old) != 1:
              raise SystemExit("WSL post step marker mismatch")
          installer = installer.replace(old, new)

          old = '$sudoers = "$LoginUser ALL=NOPASSWD: $haco host ensure, $haco host shell`n"'
          new = '$sudoers = "$LoginUser ALL=NOPASSWD: $haco host ensure`n$LoginUser ALL=NOPASSWD: $haco host shell`n"'
          if installer.count(old) != 1:
              raise SystemExit("narrow sudoers rule mismatch")
          installer = installer.replace(old, new)

          old = (
              '    $probe = Invoke-WslCapture @("--distribution", $Name, "--user", "root", "--exec", "/usr/sbin/visudo", "-cf", "/etc/sudoers.d/hacocoon-login")\n'
              '    if ($probe.ExitCode -ne 0) { throw "Failed to validate the narrow Hacocoon WSL sudo rule: $($probe.Stderr)" }\n'
          )
          new = old + (
              '    $probe = Invoke-WslCapture @("--distribution", $Name, "--user", "root", "--exec", "/usr/sbin/visudo", "-c")\n'
              '    if ($probe.ExitCode -ne 0) { throw "Failed to validate the effective Hacocoon WSL sudo policy: $($probe.Stderr)" }\n'
              '    $probe = Invoke-WslCapture @("--distribution", $Name, "--user", $LoginUser, "--exec", "sudo", "-n", $haco, "host", "ensure")\n'
              '    if ($probe.ExitCode -ne 0) { throw "Narrow Hacocoon WSL sudo rule is not effective for \'$LoginUser\': $($probe.Stderr)" }\n'
          )
          if installer.count(old) != 1:
              raise SystemExit("narrow sudoers validation marker mismatch")
          installer = installer.replace(old, new)

          old = '''try {
              Enable-BootstrapSudo $InstanceName $loginUser
              Write-Step "Running common Ubuntu install.sh inside '$InstanceName'"
              & wsl.exe --distribution $InstanceName --user $loginUser --exec env `
                  "HACO_BUNDLE_ROOT=$linuxAssetRoot" `
                  "HACO_BOOTSTRAP_SKIP_INCUS=$skipIncusValue" `
                  "HACO_BOOTSTRAP_GRANT_INCUS_ADMIN=$grantIncusAdminValue" `
                  "HACO_REQUIRE_PROVENANCE=$requireProvenance" `
                  sh "$linuxAssetRoot/install.sh" $resolvedVersion
              if ($LASTEXITCODE -ne 0) {
                  throw "Common Hacocoon Ubuntu installation failed inside WSL."
              }
          } finally {
              Disable-BootstrapSudo $InstanceName
          }
          '''
          old = re.sub(r'^          ', '', old, flags=re.M)
          new = '''Write-Step "Running common Ubuntu install.sh inside '$InstanceName'"
          & wsl.exe --distribution $InstanceName --user root --exec env `
              "HACO_INSTALL_OWNER_USER=$loginUser" `
              "HACO_BUNDLE_ROOT=$linuxAssetRoot" `
              "HACO_BOOTSTRAP_SKIP_INCUS=$skipIncusValue" `
              "HACO_BOOTSTRAP_GRANT_INCUS_ADMIN=$grantIncusAdminValue" `
              "HACO_REQUIRE_PROVENANCE=$requireProvenance" `
              sh "$linuxAssetRoot/install.sh" $resolvedVersion
          if ($LASTEXITCODE -ne 0) {
              throw "Common Hacocoon Ubuntu installation failed inside WSL."
          }
          '''
          new = re.sub(r'^          ', '', new, flags=re.M)
          if installer.count(old) != 1:
              raise SystemExit("main install invocation mismatch")
          installer = installer.replace(old, new)
          installer_path.write_text(installer, encoding="utf-8", newline="\n")

          common_path = Path("scripts/install.sh")
          common = common_path.read_text(encoding="utf-8")

          old = '''configure_workspace_owner_idmap() {
            workspace_uid="$(id -u)"
            workspace_gid="$(id -g)"
          '''
          old = re.sub(r'^          ', '', old, flags=re.M)
          new = '''configure_workspace_owner_idmap() {
            workspace_user="$(resolve_hacocoon_access_user || true)"
            if [ -n "$workspace_user" ]; then
              workspace_uid="$(id -u "$workspace_user")"
              workspace_gid="$(id -g "$workspace_user")"
            else
              workspace_uid="$(id -u)"
              workspace_gid="$(id -g)"
            fi
          '''
          new = re.sub(r'^          ', '', new, flags=re.M)
          if common.count(old) != 1:
              raise SystemExit("workspace owner idmap mismatch")
          common = common.replace(old, new)

          old = '''  if [ "$GRANT_INCUS_ADMIN" = "1" ] && [ "$(id -u)" -ne 0 ]; then
            if getent group incus-admin >/dev/null 2>&1; then
              warn "granting incus-admin gives the current Ubuntu user root-equivalent local Incus authority"
              $SUDO usermod -aG incus-admin "$(id -un)"
            else
              warn "incus-admin group does not exist after package installation"
            fi
          fi
          '''
          old = re.sub(r'^          ', '', old, flags=re.M)
          new = '''  if [ "$GRANT_INCUS_ADMIN" = "1" ]; then
            incus_admin_user="$(resolve_hacocoon_access_user || true)"
            if [ -z "$incus_admin_user" ]; then
              warn "-GrantIncusAdmin has no non-root installer user to authorize"
            elif getent group incus-admin >/dev/null 2>&1; then
              warn "granting incus-admin gives the selected Ubuntu user root-equivalent local Incus authority"
              $SUDO usermod -aG incus-admin "$incus_admin_user"
            else
              warn "incus-admin group does not exist after package installation"
            fi
          fi
          '''
          new = re.sub(r'^          ', '', new, flags=re.M)
          if common.count(old) != 1:
              raise SystemExit("incus-admin grant block mismatch")
          common = common.replace(old, new)

          old = '''resolve_hacocoon_access_user() {
            if [ "$(id -u)" -ne 0 ]; then
              id -un
              return 0
            fi
            case "${SUDO_USER:-}" in
              ""|root) return 1 ;;
              *) printf '%s\\n' "$SUDO_USER" ;;
            esac
          }
          '''
          old = re.sub(r'^          ', '', old, flags=re.M)
          new = '''resolve_hacocoon_access_user() {
            case "${HACO_INSTALL_OWNER_USER:-}" in
              "") ;;
              root) die "HACO_INSTALL_OWNER_USER must name a non-root user" ;;
              *)
                getent passwd "$HACO_INSTALL_OWNER_USER" >/dev/null 2>&1 ||
                  die "installer owner user does not exist: $HACO_INSTALL_OWNER_USER"
                printf '%s\\n' "$HACO_INSTALL_OWNER_USER"
                return 0
                ;;
            esac
            if [ "$(id -u)" -ne 0 ]; then
              id -un
              return 0
            fi
            case "${SUDO_USER:-}" in
              ""|root) return 1 ;;
              *) printf '%s\\n' "$SUDO_USER" ;;
            esac
          }
          '''
          new = re.sub(r'^          ', '', new, flags=re.M)
          if common.count(old) != 1:
              raise SystemExit("access user resolver mismatch")
          common = common.replace(old, new)
          common_path.write_text(common, encoding="utf-8", newline="\n")

          test_path = Path("tools/test_installer_packages.py")
          test = test_path.read_text(encoding="utf-8")
          for old in (
              "                'Enable-BootstrapSudo',\n",
              "                'Disable-BootstrapSudo',\n",
              "                '$LoginUser ALL=NOPASSWD: ALL',\n",
              "                '\"sudo\", \"-n\", \"/usr/bin/true\"',\n",
          ):
              if test.count(old) != 1:
                  raise SystemExit(f"test marker mismatch: {old!r}")
              test = test.replace(old, "")
          anchor = "                'Complete-InteractiveWslUserSetup',\n"
          addition = (
              "                'HACO_INSTALL_OWNER_USER=$loginUser',\n"
              "                'Ensure-SudoersDropInSupport',\n"
              "                'Narrow Hacocoon WSL sudo rule is not effective',\n"
          )
          if test.count(anchor) != 1:
              raise SystemExit("contract anchor mismatch")
          test = test.replace(anchor, anchor + addition)
          test_path.write_text(test, encoding="utf-8", newline="\n")

          en_path = Path("docs/WINDOWS_WSL_BOOTSTRAP.md")
          en = en_path.read_text(encoding="utf-8")
          old = "During the common installer run, PowerShell gives the selected ordinary WSL user a temporary passwordless sudo rule so `install.sh` can remain the ordinary workspace owner. On Ubuntu 26.04 the rule uses sudo-rs-compatible default-root syntax, and the installer validates the effective sudo policy and proves a non-interactive sudo command succeeds before starting `install.sh`. That broad bootstrap rule exists only for the trusted installer invocation and is removed in `finally`; normal completed installations retain only the narrow `haco host ensure` / `haco host shell` rule described below."
          new = "During the common installer run, PowerShell invokes the trusted packaged `install.sh` as WSL root and explicitly passes the selected ordinary WSL user as the installation owner. The common installer uses that owner for workspace UID/GID delegation and Hacocoon access-group membership, so no temporary `NOPASSWD: ALL` grant is needed. The post phase ensures standard `/etc/sudoers.d` support and retains only the narrow `haco host ensure` / `haco host shell` rule described below."
          if en.count(old) != 1:
              raise SystemExit("English doc bootstrap paragraph mismatch")
          en_path.write_text(en.replace(old, new), encoding="utf-8", newline="\n")

          ja_path = Path("docs/WINDOWS_WSL_BOOTSTRAP.ja.md")
          ja = ja_path.read_text(encoding="utf-8")
          old = "Common installer 実行中だけ、選択された通常 WSL user に temporary passwordless sudo rule を付けます。これは ordinary workspace owner のまま `install.sh` を走らせるための bootstrap 用で、trusted installer invocation の間だけ存在します。`finally` で必ず削除し、通常の install 完了後には後述の narrow な `haco host ensure` / `haco host shell` rule だけを残します。"
          new = "Common installer は、PowerShell から trusted な package 内 `install.sh` を WSL root として実行し、選択された通常 WSL user を installation owner として明示的に渡します。Common installer はその user の UID/GID を workspace delegation と Hacocoon access group に使うため、一時的な `NOPASSWD: ALL` は不要です。Post phase では標準の `/etc/sudoers.d` support を保証し、通常の install 完了後には後述の narrow な `haco host ensure` / `haco host shell` rule だけを残します。"
          if ja.count(old) != 1:
              raise SystemExit("Japanese doc bootstrap paragraph mismatch")
          ja_path.write_text(ja.replace(old, new), encoding="utf-8", newline="\n")

      - name: Commit patch and remove temporary helper
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/pr403-root-install-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/install-windows.ps1 scripts/install.sh tools/test_installer_packages.py docs/WINDOWS_WSL_BOOTSTRAP.md docs/WINDOWS_WSL_BOOTSTRAP.ja.md .github/workflows/pr403-root-install-patch.yml
          git diff --cached --check
          git commit -m "fix(windows): avoid temporary full sudo during bootstrap"
          git push origin HEAD:fix/windows-one-shot-bootstrap
