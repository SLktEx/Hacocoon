name: kubevirt rawfile btrfs cow spike

on:
  push:
    branches:
      - main-kube
    paths:
      - .github/workflows/kubevirt-rawfile-btrfs-cow-spike.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kubevirt-rawfile-btrfs-cow-spike-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rawfile-btrfs-cow:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install minikube
        run: |
          set -euxo pipefail
          curl -fsSLo minikube https://storage.googleapis.com/minikube/releases/latest/minikube-linux-amd64
          chmod +x minikube
          sudo install minikube /usr/local/bin/minikube
          minikube version
          helm version

      - name: Start Kubernetes 1.36
        run: |
          set -euxo pipefail
          minikube start \
            --driver=docker \
            --kubernetes-version=v1.36.2 \
            --cpus=3 \
            --memory=5000mb \
            --wait=all \
            --wait-timeout=8m
          kubectl version
          kubectl get nodes -o wide

      - name: Create Btrfs loopback pool inside the Kubernetes node
        run: |
          set -euxo pipefail
          minikube ssh -- 'sudo apt-get update && sudo apt-get install -y btrfs-progs e2fsprogs'
          minikube ssh -- 'set -eux; sudo truncate -s 6G /var/lib/hacocoon-rawfile-btrfs.img; sudo mkfs.btrfs -f /var/lib/hacocoon-rawfile-btrfs.img; sudo mkdir -p /var/local/openebs/rawfile/haco-pool; sudo mount -o loop,compress=zstd /var/lib/hacocoon-rawfile-btrfs.img /var/local/openebs/rawfile/haco-pool; findmnt -T /var/local/openebs/rawfile/haco-pool -o TARGET,SOURCE,FSTYPE,OPTIONS; sudo btrfs filesystem usage --raw /var/local/openebs/rawfile/haco-pool'
          FSTYPE="$(minikube ssh -- 'findmnt -n -o FSTYPE -T /var/local/openebs/rawfile/haco-pool' | tr -d '\r')"
          test "$FSTYPE" = btrfs
          minikube ssh -- 'findmnt -n -o OPTIONS -T /var/local/openebs/rawfile/haco-pool' | grep -q 'compress=zstd'

      - name: Build RawFile with snapshot-restore COW probe fix
        run: |
          set -euxo pipefail
          # Pin the upstream source used to diagnose the restore bug. The stock
          # implementation passes the destination disk *file* to a helper that
          # expects a destination directory, causing its COW probe to construct
          # disk.img/.cow_test_clone and fall back to --reflink=never.
          RAWFILE_SHA=22a2884d9931b1af17698fb6f254f742db8b5909
          git clone --filter=blob:none https://github.com/openebs/rawfile-localpv.git /tmp/rawfile-localpv
          git -C /tmp/rawfile-localpv checkout "$RAWFILE_SHA"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/rawfile-localpv/rawfile/utils/snapshot_manager.py')
          text = p.read_text()
          old = 'is_cow_supported(Path(os.path.dirname(snap_path)), destination)'
          new = 'is_cow_supported(Path(os.path.dirname(snap_path)), destination.parent)'
          assert old in text, 'upstream restore probe changed; re-evaluate the experiment'
          p.write_text(text.replace(old, new, 1))
          PY
          git -C /tmp/rawfile-localpv diff --check
          git -C /tmp/rawfile-localpv diff -- rawfile/utils/snapshot_manager.py
          docker build \
            --build-arg IMAGE_TAG=haco-cowfix \
            --build-arg PROVISIONER_VERSION=haco-cowfix \
            -t rawfile-localpv:haco-cowfix \
            /tmp/rawfile-localpv
          minikube image load rawfile-localpv:haco-cowfix
          minikube image ls | grep -q 'rawfile-localpv:haco-cowfix'

      - name: Install OpenEBS RawFile with Btrfs COW storage class
        run: |
          set -euxo pipefail
          cat >/tmp/rawfile-values.yaml <<'EOF'
          analytics:
            enabled: false
          logLevel: DEBUG
          node:
            defaultPool: haco
            storagePools:
              haco:
                path: /var/local/openebs/rawfile/haco-pool
            metadataDirPath: /var/local/openebs/rawfile/haco-pool/.meta
          storageClasses:
            - name: rawfile-btrfs-cow
              enabled: true
              volumeBindingMode: WaitForFirstConsumer
              isDefault: false
              allowVolumeExpansion: true
              reclaimPolicy: Delete
              fsType: ext4
              thinProvision: true
              mountOptions: []
              formatOptions: []
              copyOnWrite: true
              freezeFs: false
              storagePool: haco
          snapshotClasses:
            - name: rawfile-btrfs-cow
              enabled: true
              deletionPolicy: Delete
              isDefault: false
          capabilities:
            snapshots:
              enabled: true
          EOF

          helm repo add rawfile-localpv https://openebs.github.io/rawfile-localpv
          helm repo update rawfile-localpv
          helm install rawfile-localpv rawfile-localpv/rawfile-localpv \
            --namespace openebs \
            --create-namespace \
            --values /tmp/rawfile-values.yaml

          # Let the stock chart create the exact current workload shape first.
          # Then replace only the RawFile CSI implementation container with the
          # locally built one-line diagnostic fix. This avoids the chart's image
          # registry fallback while leaving all sidecar versions untouched.
          kubectl -n openebs rollout status daemonset/rawfile-localpv-node --timeout=8m
          kubectl -n openebs set image daemonset/rawfile-localpv-node \
            csi-driver=rawfile-localpv:haco-cowfix
          kubectl -n openebs rollout status daemonset/rawfile-localpv-node --timeout=8m
          kubectl -n openebs wait --for=condition=Ready pod --all --timeout=8m
          test "$(kubectl -n openebs get daemonset rawfile-localpv-node -o jsonpath='{.spec.template.spec.containers[?(@.name=="csi-driver")].image}')" = rawfile-localpv:haco-cowfix

          kubectl get csidriver
          kubectl get storageclass rawfile-btrfs-cow -o yaml
          kubectl get volumesnapshotclass rawfile-btrfs-cow -o yaml
          test "$(kubectl get storageclass rawfile-btrfs-cow -o jsonpath='{.provisioner}')" = rawfile.csi.openebs.io
          test "$(kubectl get storageclass rawfile-btrfs-cow -o jsonpath='{.parameters.copyOnWrite}')" = true
          test "$(kubectl get storageclass rawfile-btrfs-cow -o jsonpath='{.parameters.thinProvision}')" = true

      - name: Create and seed source block volume
        run: |
          set -euxo pipefail
          cat <<'EOF' | kubectl apply -f -
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: cow-source
          spec:
            accessModes:
              - ReadWriteOnce
            volumeMode: Block
            storageClassName: rawfile-btrfs-cow
            resources:
              requests:
                storage: 1Gi
          ---
          apiVersion: v1
          kind: Pod
          metadata:
            name: cow-source-writer
          spec:
            restartPolicy: Never
            containers:
              - name: writer
                image: busybox:1.37
                command:
                  - sh
                  - -ceu
                  - |
                    dd if=/dev/urandom of=/dev/haco-source bs=1M count=64 conv=fsync
                    dd if=/dev/haco-source bs=1M count=64 2>/dev/null | sha256sum
                volumeDevices:
                  - name: source
                    devicePath: /dev/haco-source
            volumes:
              - name: source
                persistentVolumeClaim:
                  claimName: cow-source
          EOF
          kubectl wait --for=jsonpath='{.status.phase}'=Succeeded pod/cow-source-writer --timeout=8m
          SOURCE_HASH="$(kubectl logs cow-source-writer | tail -n 1 | awk '{print $1}')"
          test -n "$SOURCE_HASH"
          echo "SOURCE_HASH=$SOURCE_HASH" >> "$GITHUB_ENV"
          echo "source hash=$SOURCE_HASH"

          SOURCE_PV="$(kubectl get pvc cow-source -o jsonpath='{.spec.volumeName}')"
          SOURCE_HANDLE="$(kubectl get pv "$SOURCE_PV" -o jsonpath='{.spec.csi.volumeHandle}')"
          test -n "$SOURCE_HANDLE"
          echo "SOURCE_HANDLE=$SOURCE_HANDLE" >> "$GITHUB_ENV"
          echo "source handle=$SOURCE_HANDLE"
          minikube ssh -- "sudo btrfs filesystem du -s /var/local/openebs/rawfile/haco-pool/${SOURCE_HANDLE}/disk.img"
          minikube ssh -- 'sudo btrfs filesystem usage --raw /var/local/openebs/rawfile/haco-pool'

      - name: Snapshot source volume
        run: |
          set -euxo pipefail
          SNAP_START_NS="$(date +%s%N)"
          cat <<'EOF' | kubectl apply -f -
          apiVersion: snapshot.storage.k8s.io/v1
          kind: VolumeSnapshot
          metadata:
            name: cow-source-snapshot
          spec:
            volumeSnapshotClassName: rawfile-btrfs-cow
            source:
              persistentVolumeClaimName: cow-source
          EOF
          for i in $(seq 1 180); do
            READY="$(kubectl get volumesnapshot cow-source-snapshot -o jsonpath='{.status.readyToUse}' 2>/dev/null || true)"
            [ "$READY" = true ] && break
            sleep 2
          done
          test "$(kubectl get volumesnapshot cow-source-snapshot -o jsonpath='{.status.readyToUse}')" = true
          SNAP_END_NS="$(date +%s%N)"
          echo "snapshot elapsed_ms=$(( (SNAP_END_NS - SNAP_START_NS) / 1000000 ))"
          kubectl get volumesnapshot cow-source-snapshot -o yaml
          minikube ssh -- "sudo find /var/local/openebs/rawfile/haco-pool/${SOURCE_HANDLE}/snapshots -maxdepth 2 -type f -name '*.img' -print -exec btrfs filesystem du -s {} \;"

      - name: Restore clone from snapshot and prove independent writable COW state
        run: |
          set -euxo pipefail
          CLONE_START_NS="$(date +%s%N)"
          cat <<'EOF' | kubectl apply -f -
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: cow-clone
          spec:
            accessModes:
              - ReadWriteOnce
            volumeMode: Block
            storageClassName: rawfile-btrfs-cow
            dataSource:
              name: cow-source-snapshot
              kind: VolumeSnapshot
              apiGroup: snapshot.storage.k8s.io
            resources:
              requests:
                storage: 1Gi
          ---
          apiVersion: v1
          kind: Pod
          metadata:
            name: cow-clone-consumer
          spec:
            restartPolicy: Never
            containers:
              - name: consumer
                image: busybox:1.37
                command: ["sh", "-c", "true"]
                volumeDevices:
                  - name: clone
                    devicePath: /dev/haco-clone
            volumes:
              - name: clone
                persistentVolumeClaim:
                  claimName: cow-clone
          EOF
          kubectl wait --for=jsonpath='{.status.phase}'=Succeeded pod/cow-clone-consumer --timeout=8m
          CLONE_END_NS="$(date +%s%N)"
          echo "snapshot restore + first attach elapsed_ms=$(( (CLONE_END_NS - CLONE_START_NS) / 1000000 ))"

          CLONE_PV="$(kubectl get pvc cow-clone -o jsonpath='{.spec.volumeName}')"
          CLONE_HANDLE="$(kubectl get pv "$CLONE_PV" -o jsonpath='{.spec.csi.volumeHandle}')"
          test -n "$CLONE_HANDLE"
          echo "CLONE_HANDLE=$CLONE_HANDLE" >> "$GITHUB_ENV"
          echo "clone handle=$CLONE_HANDLE"

          # Wait for the completed consumer's loop device to be detached before
          # manipulating backing files directly. This avoids kubectl exec transport
          # noise and isolates the storage semantics under test.
          for i in $(seq 1 60); do
            attached="$(minikube ssh -- "sudo losetup -j /var/local/openebs/rawfile/haco-pool/${CLONE_HANDLE}/disk.img" | tr -d '\r')"
            [ -z "$attached" ] && break
            sleep 1
          done
          test -z "$(minikube ssh -- "sudo losetup -j /var/local/openebs/rawfile/haco-pool/${CLONE_HANDLE}/disk.img" | tr -d '\r')"

          echo 'Btrfs extent accounting immediately after snapshot restore:'
          minikube ssh -- "sudo btrfs filesystem du -s /var/local/openebs/rawfile/haco-pool/${SOURCE_HANDLE}/disk.img /var/local/openebs/rawfile/haco-pool/${CLONE_HANDLE}/disk.img"
          minikube ssh -- "sudo filefrag -v /var/local/openebs/rawfile/haco-pool/${SOURCE_HANDLE}/disk.img /var/local/openebs/rawfile/haco-pool/${CLONE_HANDLE}/disk.img"
          # A restored clone must contain shared extents. This is the hard COW
          # assertion that the stock 0.15.0 path failed in the previous run.
          minikube ssh -- "sudo filefrag -v /var/local/openebs/rawfile/haco-pool/${CLONE_HANDLE}/disk.img" | grep -q shared

          BEFORE_SOURCE_HASH="$(minikube ssh -- "sudo dd if=/var/local/openebs/rawfile/haco-pool/${SOURCE_HANDLE}/disk.img bs=1M count=64 2>/dev/null | sha256sum" | awk '{print $1}' | tr -d '\r')"
          BEFORE_CLONE_HASH="$(minikube ssh -- "sudo dd if=/var/local/openebs/rawfile/haco-pool/${CLONE_HANDLE}/disk.img bs=1M count=64 2>/dev/null | sha256sum" | awk '{print $1}' | tr -d '\r')"
          echo "before source=$BEFORE_SOURCE_HASH clone=$BEFORE_CLONE_HASH expected=$SOURCE_HASH"
          test "$BEFORE_SOURCE_HASH" = "$SOURCE_HASH"
          test "$BEFORE_CLONE_HASH" = "$SOURCE_HASH"

          minikube ssh -- "sudo dd if=/dev/zero of=/var/local/openebs/rawfile/haco-pool/${CLONE_HANDLE}/disk.img bs=1M count=8 conv=notrunc,fsync"
          AFTER_SOURCE_HASH="$(minikube ssh -- "sudo dd if=/var/local/openebs/rawfile/haco-pool/${SOURCE_HANDLE}/disk.img bs=1M count=64 2>/dev/null | sha256sum" | awk '{print $1}' | tr -d '\r')"
          AFTER_CLONE_HASH="$(minikube ssh -- "sudo dd if=/var/local/openebs/rawfile/haco-pool/${CLONE_HANDLE}/disk.img bs=1M count=64 2>/dev/null | sha256sum" | awk '{print $1}' | tr -d '\r')"
          echo "after source=$AFTER_SOURCE_HASH clone=$AFTER_CLONE_HASH"
          test "$AFTER_SOURCE_HASH" = "$SOURCE_HASH"
          test "$AFTER_CLONE_HASH" != "$SOURCE_HASH"

          echo 'Btrfs extent accounting after clone-only write:'
          minikube ssh -- "sudo btrfs filesystem du -s /var/local/openebs/rawfile/haco-pool/${SOURCE_HANDLE}/disk.img /var/local/openebs/rawfile/haco-pool/${CLONE_HANDLE}/disk.img"
          minikube ssh -- 'sudo btrfs filesystem usage --raw /var/local/openebs/rawfile/haco-pool'

          DRIVER_LOG="$(kubectl -n openebs logs -l app.kubernetes.io/name=rawfile-localpv -c csi-driver --prefix --tail=2000 2>/dev/null || true)"
          echo "$DRIVER_LOG" | grep -F -- '--reflink=always' | tail -n 10
          if echo "$DRIVER_LOG" | grep -F -- '--reflink=never' | grep -F "$CLONE_HANDLE"; then
            echo 'ERROR: snapshot restore fell back to a full byte copy' >&2
            exit 1
          fi

      - name: Record driver evidence
        if: always()
        run: |
          set +e
          kubectl get pvc,pv,pods -o wide
          kubectl get volumesnapshot,volumesnapshotcontent -o wide
          kubectl -n openebs get pods -o wide
          echo 'RawFile logs mentioning snapshots / reflinks / clone:'
          for pod in $(kubectl -n openebs get pods -o name); do
            kubectl -n openebs logs "$pod" --all-containers=true --prefix --tail=1000 2>/dev/null | grep -Ei 'snapshot|reflink|clone|copy.on.write|copy_on_write' || true
          done
          minikube ssh -- 'findmnt -T /var/local/openebs/rawfile/haco-pool -o TARGET,SOURCE,FSTYPE,OPTIONS; sudo btrfs filesystem usage --raw /var/local/openebs/rawfile/haco-pool'
