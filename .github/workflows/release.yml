name: release

on:
  repository_dispatch:
    types: [release]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.client_payload.tag }}
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.trust.outputs.release_tag }}
      release_sha: ${{ steps.trust.outputs.release_sha }}
    steps:
      - name: Checkout trusted release control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: control

      - name: Authorize requested release from current trusted main HEAD
        id: trust
        shell: bash
        env:
          REQUESTED_TAG: ${{ github.event.client_payload.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          if [[ -z "$DEFAULT_BRANCH" ]]; then
            echo "Refusing release: default branch is unavailable" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "Refusing release: repository_dispatch must execute from trusted default branch" >&2
            exit 1
          fi
          if [[ "$GITHUB_SHA" != "$(git -C control rev-parse HEAD)" ]]; then
            echo "Refusing release: checked-out control plane does not match dispatcher SHA" >&2
            exit 1
          fi

          bash control/tools/check_release_tag_trust.sh "$REQUESTED_TAG" origin "$DEFAULT_BRANCH"
          release_sha="$(git -C control rev-parse --verify "refs/tags/${REQUESTED_TAG}^{commit}")"
          if [[ "$release_sha" != "$GITHUB_SHA" ]]; then
            echo "Refusing release: tag must resolve to the dispatcher/current trusted main HEAD ($GITHUB_SHA), got $release_sha" >&2
            exit 1
          fi

          printf 'release_tag=%s\n' "$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
          printf 'release_sha=%s\n' "$release_sha" >> "$GITHUB_OUTPUT"
          printf 'Authorized %s at current trusted main HEAD %s\n' "$REQUESTED_TAG" "$release_sha"

      - name: Checkout authorized release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.trust.outputs.release_sha }}
          fetch-depth: 1
          fetch-tags: true
          persist-credentials: false
          path: source

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.0
          check-latest: false
          cache: false

      - name: Install pinned GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          install-only: true

      - name: Record release toolchain versions
        shell: bash
        run: |
          set -euo pipefail
          go version
          goreleaser --version

      - name: Test authorized source
        working-directory: source
        run: go test -count=1 ./...

      - name: Vet authorized source
        working-directory: source
        run: go vet ./...

      - name: Validate Linux installers
        working-directory: source
        run: bash -n scripts/install.sh scripts/bootstrap-wsl.sh

      - name: Validate Windows installers
        working-directory: source
        shell: pwsh
        run: |
          [scriptblock]::Create((Get-Content -Raw "scripts/bootstrap-windows.ps1")) | Out-Null
          [scriptblock]::Create((Get-Content -Raw "scripts/install-windows.ps1")) | Out-Null

      - name: Validate Windows installer bundle
        working-directory: source
        run: python3 tools/test_windows_installer_launcher.py

      - name: Build authorized release artifacts
        working-directory: source
        run: goreleaser release --clean --skip=publish

      - name: Stage exact release payload
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          archives=(source/dist/haco_linux_*.tar.gz)
          if (( ${#archives[@]} != 2 )); then
            echo "Expected exactly two Linux archives, found ${#archives[@]}" >&2
            printf '  %s\n' "${archives[@]}" >&2
            exit 1
          fi

          test -f source/dist/haco_linux_amd64.tar.gz
          test -f source/dist/haco_linux_arm64.tar.gz
          test -f source/dist/checksums.txt
          test -f source/scripts/install.sh
          test -f source/scripts/bootstrap-wsl.sh
          test -f source/scripts/install-windows.bat
          test -f source/scripts/install-windows.ps1
          test -f source/tools/package_windows_installer.py

          rm -rf release-payload
          mkdir -m 0700 release-payload
          cp source/dist/haco_linux_amd64.tar.gz release-payload/
          cp source/dist/haco_linux_arm64.tar.gz release-payload/
          cp source/dist/checksums.txt release-payload/
          cp source/scripts/install.sh release-payload/
          cp source/scripts/bootstrap-wsl.sh release-payload/
          cp source/scripts/install-windows.ps1 release-payload/
          python3 source/tools/package_windows_installer.py release-payload/hacocoon-windows-installer.zip
          (
            cd release-payload
            sha256sum hacocoon-windows-installer.zip >> checksums.txt
          )

      - name: Transfer release payload to privileged publisher
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-payload
          path: release-payload/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    needs: build
    environment: release
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
      RELEASE_SHA: ${{ needs.build.outputs.release_sha }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Download payload from this workflow run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-payload
          path: release-payload

      - name: Validate publisher input
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(release-payload/*)
          archives=(release-payload/haco_linux_*.tar.gz)
          (( ${#files[@]} == 7 )) || { printf 'Unexpected release payload file count: %s\n' "${#files[@]}" >&2; exit 1; }
          (( ${#archives[@]} == 2 )) || { printf 'Unexpected Linux archive count: %s\n' "${#archives[@]}" >&2; exit 1; }
          test -f release-payload/haco_linux_amd64.tar.gz
          test -f release-payload/haco_linux_arm64.tar.gz
          test -f release-payload/hacocoon-windows-installer.zip
          test -f release-payload/checksums.txt
          test -f release-payload/install.sh
          test -f release-payload/bootstrap-wsl.sh
          test -f release-payload/install-windows.ps1

      - name: Revalidate release authorization immediately before signing and publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ -z "$DEFAULT_BRANCH" ]]; then
            echo "Refusing release: default branch is unavailable at publish time" >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Refusing release: invalid release tag output: $RELEASE_TAG" >&2
            exit 1
          fi
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Refusing release: invalid release SHA output: $RELEASE_SHA" >&2
            exit 1
          fi
          if [[ "$RELEASE_SHA" != "$GITHUB_SHA" ]]; then
            echo "Refusing release: authorized release SHA no longer matches trusted dispatcher SHA ($GITHUB_SHA)" >&2
            exit 1
          fi

          branch_json="$(gh api "repos/$GITHUB_REPOSITORY/branches/$DEFAULT_BRANCH")"
          current_main_sha="$(jq -r '.commit.sha' <<<"$branch_json")"
          if [[ ! "$current_main_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Refusing release: current trusted default-branch HEAD is invalid" >&2
            exit 1
          fi
          if [[ "$current_main_sha" != "$RELEASE_SHA" ]]; then
            echo "Refusing release: trusted default branch moved after release authorization ($RELEASE_SHA -> $current_main_sha)" >&2
            exit 1
          fi

          ref_json="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG")"
          object_type="$(jq -r '.object.type' <<<"$ref_json")"
          object_sha="$(jq -r '.object.sha' <<<"$ref_json")"

          depth=0
          while [[ "$object_type" == "tag" ]]; do
            depth=$((depth + 1))
            if (( depth > 8 )); then
              echo "Refusing release: annotated tag chain is unexpectedly deep" >&2
              exit 1
            fi
            tag_json="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha")"
            object_type="$(jq -r '.object.type' <<<"$tag_json")"
            object_sha="$(jq -r '.object.sha' <<<"$tag_json")"
          done

          if [[ "$object_type" != "commit" ]]; then
            echo "Refusing release: tag does not resolve to a commit" >&2
            exit 1
          fi
          if [[ "$object_sha" != "$RELEASE_SHA" ]]; then
            echo "Refusing release: tag moved after build ($RELEASE_SHA -> $object_sha)" >&2
            exit 1
          fi

          printf 'Release authorization remains current: %s -> %s on %s HEAD.\n' "$RELEASE_TAG" "$RELEASE_SHA" "$DEFAULT_BRANCH"

      - name: Create signed release binding predicate
        if: ${{ !github.event.repository.private }}
        shell: bash
        env:
          CONTROL_REF: ${{ github.ref }}
          CONTROL_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os

          predicate = {
              "tag": os.environ["RELEASE_TAG"],
              "commit": os.environ["RELEASE_SHA"],
              "controlRef": os.environ["CONTROL_REF"],
              "controlSha": os.environ["CONTROL_SHA"],
              "authorizationEnvironment": "release",
          }
          with open("release-binding.json", "w", encoding="utf-8") as handle:
              json.dump(predicate, handle, sort_keys=True, separators=(",", ":"))
              handle.write("\n")
          PY

      - name: Attest public release payload provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release-payload/haco_linux_amd64.tar.gz
            release-payload/haco_linux_arm64.tar.gz
            release-payload/hacocoon-windows-installer.zip
            release-payload/checksums.txt
            release-payload/install.sh
            release-payload/bootstrap-wsl.sh
            release-payload/install-windows.ps1

      - name: Attest public release tag and commit binding
        if: ${{ !github.event.repository.private }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release-payload/haco_linux_amd64.tar.gz
            release-payload/haco_linux_arm64.tar.gz
            release-payload/hacocoon-windows-installer.zip
            release-payload/checksums.txt
            release-payload/install.sh
            release-payload/bootstrap-wsl.sh
            release-payload/install-windows.ps1
          predicate-type: https://hacocoon.dev/attestations/release/v1
          predicate-path: release-binding.json

      - name: Explain private repository provenance limitation
        if: ${{ github.event.repository.private }}
        shell: bash
        run: |
          echo "::notice::GitHub artifact attestations are skipped while Hacocoon is private. Public releases will fail closed if provenance generation fails."

      - name: Create populated draft release and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          args=(
            --repo "$GITHUB_REPOSITORY"
            --verify-tag
            --generate-notes
            --title "Hacocoon $RELEASE_TAG"
            --draft
          )
          if [[ "$RELEASE_TAG" == *-* ]]; then
            args+=(--prerelease)
          fi

          gh release create "$RELEASE_TAG" \
            release-payload/haco_linux_amd64.tar.gz \
            release-payload/haco_linux_arm64.tar.gz \
            release-payload/hacocoon-windows-installer.zip \
            release-payload/checksums.txt \
            release-payload/install.sh \
            release-payload/bootstrap-wsl.sh \
            release-payload/install-windows.ps1 \
            "${args[@]}"

          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false
