name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require release tag on trusted main history
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash tools/check_release_tag_trust.sh "$GITHUB_REF_NAME" origin "$DEFAULT_BRANCH"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.0
          check-latest: false
          cache: false

      - name: Install pinned GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          install-only: true

      - name: Record release toolchain versions
        shell: bash
        run: |
          set -euo pipefail
          go version
          goreleaser --version

      - name: Test
        run: go test -count=1 ./...

      - name: Vet
        run: go vet ./...

      - name: Validate Linux installers
        run: bash -n scripts/install.sh scripts/bootstrap-wsl.sh

      - name: Validate Windows installers
        shell: pwsh
        run: |
          [scriptblock]::Create((Get-Content -Raw "scripts/bootstrap-windows.ps1")) | Out-Null
          [scriptblock]::Create((Get-Content -Raw "scripts/install-windows.ps1")) | Out-Null

      - name: Build release artifacts
        run: goreleaser release --clean --skip=publish

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          archives=(dist/haco_linux_*.tar.gz)
          if (( ${#archives[@]} != 2 )); then
            echo "Expected exactly two Linux archives, found ${#archives[@]}" >&2
            printf '  %s\n' "${archives[@]}" >&2
            exit 1
          fi

          test -f dist/checksums.txt
          test -f scripts/install.sh
          test -f scripts/bootstrap-wsl.sh
          test -f scripts/install-windows.ps1

          args=(
            --repo "$GITHUB_REPOSITORY"
            --verify-tag
            --generate-notes
            --title "Hacocoon $GITHUB_REF_NAME"
          )
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            args+=(--prerelease)
          fi

          gh release create "$GITHUB_REF_NAME" \
            "${archives[@]}" \
            dist/checksums.txt \
            scripts/install.sh \
            scripts/bootstrap-wsl.sh \
            scripts/install-windows.ps1 \
            "${args[@]}"
