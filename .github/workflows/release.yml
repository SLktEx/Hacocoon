name: release

on:
  repository_dispatch:
    types: [release]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event.client_payload.tag }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate trusted default-branch release request
        shell: bash
        run: bash tools/check_release_request.sh "$RELEASE_TAG" "$GITHUB_REF" "$DEFAULT_BRANCH" "$GITHUB_SHA" origin

      - name: Require release tag to be owned by trusted automation
        shell: bash
        run: |
          set -euo pipefail
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1
          tag_status=$?
          set -e
          case "$tag_status" in
            2)
              ;;
            0)
              echo "Refusing release: tag already exists: $RELEASE_TAG" >&2
              exit 1
              ;;
            *)
              echo "Refusing release: unable to prove tag is absent: $RELEASE_TAG" >&2
              exit 1
              ;;
          esac
          git tag "$RELEASE_TAG" "$GITHUB_SHA"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.0
          check-latest: false
          cache: false

      - name: Install pinned GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          install-only: true

      - name: Record release toolchain versions
        shell: bash
        run: |
          set -euo pipefail
          go version
          goreleaser --version

      - name: Test
        run: go test -count=1 ./...

      - name: Vet
        run: go vet ./...

      - name: Validate Linux installers
        run: bash -n scripts/install.sh scripts/bootstrap-wsl.sh

      - name: Validate Windows installers
        shell: pwsh
        run: |
          [scriptblock]::Create((Get-Content -Raw "scripts/bootstrap-windows.ps1")) | Out-Null
          [scriptblock]::Create((Get-Content -Raw "scripts/install-windows.ps1")) | Out-Null

      - name: Build release artifacts
        run: goreleaser release --clean --skip=publish

      - name: Stage exact release payload
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          archives=(dist/haco_linux_*.tar.gz)
          if (( ${#archives[@]} != 2 )); then
            echo "Expected exactly two Linux archives, found ${#archives[@]}" >&2
            printf '  %s\n' "${archives[@]}" >&2
            exit 1
          fi

          test -f dist/haco_linux_amd64.tar.gz
          test -f dist/haco_linux_arm64.tar.gz
          test -f dist/checksums.txt
          test -f scripts/install.sh
          test -f scripts/bootstrap-wsl.sh
          test -f scripts/install-windows.ps1

          rm -rf release-payload
          mkdir -m 0700 release-payload
          cp dist/haco_linux_amd64.tar.gz release-payload/
          cp dist/haco_linux_arm64.tar.gz release-payload/
          cp dist/checksums.txt release-payload/
          cp scripts/install.sh release-payload/
          cp scripts/bootstrap-wsl.sh release-payload/
          cp scripts/install-windows.ps1 release-payload/

      - name: Transfer release payload to privileged publisher
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-payload
          path: release-payload/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ github.event.client_payload.tag }}
    steps:
      - name: Download payload from this workflow run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-payload
          path: release-payload

      - name: Validate publisher input
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(release-payload/*)
          archives=(release-payload/haco_linux_*.tar.gz)
          (( ${#files[@]} == 6 )) || { printf 'Unexpected release payload file count: %s\n' "${#files[@]}" >&2; exit 1; }
          (( ${#archives[@]} == 2 )) || { printf 'Unexpected Linux archive count: %s\n' "${#archives[@]}" >&2; exit 1; }
          test -f release-payload/haco_linux_amd64.tar.gz
          test -f release-payload/haco_linux_arm64.tar.gz
          test -f release-payload/checksums.txt
          test -f release-payload/install.sh
          test -f release-payload/bootstrap-wsl.sh
          test -f release-payload/install-windows.ps1

      - name: Refuse pre-existing release tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha >/dev/null 2>&1; then
            echo "Refusing release: tag already exists before trusted publication: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Attest public release payload
        if: ${{ !github.event.repository.private }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release-payload/haco_linux_amd64.tar.gz
            release-payload/haco_linux_arm64.tar.gz
            release-payload/checksums.txt
            release-payload/install.sh
            release-payload/bootstrap-wsl.sh
            release-payload/install-windows.ps1

      - name: Explain private repository provenance limitation
        if: ${{ github.event.repository.private }}
        shell: bash
        run: |
          echo "::notice::GitHub artifact attestations are skipped while Hacocoon is private. Public releases will fail closed if provenance generation fails."

      - name: Create populated draft release from trusted main SHA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          args=(
            --repo "$GITHUB_REPOSITORY"
            --target "$GITHUB_SHA"
            --generate-notes
            --title "Hacocoon $RELEASE_TAG"
            --draft
          )
          if [[ "$RELEASE_TAG" == *-* ]]; then
            args+=(--prerelease)
          fi

          gh release create "$RELEASE_TAG" \
            release-payload/haco_linux_amd64.tar.gz \
            release-payload/haco_linux_arm64.tar.gz \
            release-payload/checksums.txt \
            release-payload/install.sh \
            release-payload/bootstrap-wsl.sh \
            release-payload/install-windows.ps1 \
            "${args[@]}"

          release_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)"
          if [[ "$release_sha" != "$GITHUB_SHA" ]]; then
            echo "Refusing publication: release tag resolved to $release_sha instead of trusted source $GITHUB_SHA" >&2
            exit 1
          fi

          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false
