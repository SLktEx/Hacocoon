name: patch-pr403-output

on:
  push:
    branches:
      - fix/windows-one-shot-bootstrap
    paths:
      - .github/workflows/patch-pr403-output.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/windows-one-shot-bootstrap
          persist-credentials: true

      - name: Keep WSL console output out of helper return values
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/install-windows.ps1')
          text = path.read_text(encoding='utf-8')

          managed_old = '''    Set-WslDefaultUser $Name $ManagedLoginUser
              & wsl.exe --terminate $Name
              if ($LASTEXITCODE -ne 0) { throw "Failed to restart '$Name' after configuring the managed login user." }
          '''
          managed_new = '''    Set-WslDefaultUser $Name $ManagedLoginUser
              & wsl.exe --terminate $Name | Out-Null
              if ($LASTEXITCODE -ne 0) { throw "Failed to restart '$Name' after configuring the managed login user." }
          '''
          if managed_old not in text:
              raise SystemExit('managed-user terminate block not found')
          text = text.replace(managed_old, managed_new, 1)

          interactive_old = '''    & wsl.exe --distribution $Name
              if ($LASTEXITCODE -ne 0) {
                  throw "Interactive Ubuntu user setup in '$Name' failed."
              }
          '''
          interactive_new = '''    & wsl.exe --distribution $Name | Out-Host
              if ($LASTEXITCODE -ne 0) {
                  throw "Interactive Ubuntu user setup in '$Name' failed."
              }
          '''
          if interactive_old not in text:
              raise SystemExit('interactive-user WSL block not found')
          text = text.replace(interactive_old, interactive_new, 1)
          path.write_text(text, encoding='utf-8', newline='\n')

          test_path = Path('tools/test_installer_packages.py')
          tests = test_path.read_text(encoding='utf-8')
          marker = "                '$OutputEncoding = [Text.UTF8Encoding]::new($false)',\n"
          additions = (
              "                '& wsl.exe --terminate $Name | Out-Null',\n"
              "                '& wsl.exe --distribution $Name | Out-Host',\n"
          )
          if additions not in tests:
              if marker not in tests:
                  raise SystemExit('one-shot contract insertion point not found')
              tests = tests.replace(marker, marker + additions, 1)
          test_path.write_text(tests, encoding='utf-8', newline='\n')
          PY

          git diff --check
          python3 tools/test_installer_packages.py
          pwsh -NoLogo -NoProfile -Command '[scriptblock]::Create((Get-Content -LiteralPath "scripts/install-windows.ps1" -Raw)) | Out-Null'
          git add scripts/install-windows.ps1 tools/test_installer_packages.py
          git commit -m "fix(windows): keep WSL output out of login user result"
          git push origin HEAD:fix/windows-one-shot-bootstrap
