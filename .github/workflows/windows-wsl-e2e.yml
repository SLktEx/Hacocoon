name: windows-wsl-e2e

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: windows-wsl-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  windows-wsl-e2e:
    runs-on: windows-2025
    timeout-minutes: 35
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Windows/WSL E2E helper
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'test/e2e/windows_wsl.ps1'),
            [ref]$null,
            [ref]$errors
          )
          if ($errors.Count -ne 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }
      - name: Run Windows -> WSL2 -> Ubuntu 26.04 -> systemd -> real Incus E2E
        shell: pwsh
        run: ./test/e2e/windows_wsl.ps1
