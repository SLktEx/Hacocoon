changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: "💥 Breaking Changes"
      labels:
        - breaking-change
    - title: "🔒 Security"
      labels:
        - security
    - title: "✨ Features"
      labels:
        - enhancement
        - feature
    - title: "🐛 Fixes"
      labels:
        - bug
        - fix
    - title: "📦 Dependencies"
      labels:
        - dependencies
    - title: "📚 Documentation"
      labels:
        - documentation
        - docs
    - title: "Other Changes"
      labels:
        - "*"
